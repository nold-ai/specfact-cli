name: Dev security create-only CI signer
on:
  workflow_dispatch:
    inputs:
      expected_executor:
        type: string
        required: true
      expected_intent:
        type: string
        required: true
permissions: {}
concurrency:
  group: dev-security-create-only-signer
  cancel-in-progress: false
jobs:
  publish-checkpoints:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Verify original public upload log before signing writes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -I -S - <<'PY'
          import hashlib, http.client, os, urllib.parse
          connection = http.client.HTTPSConnection('api.github.com', timeout=20)
          try:
              connection.request('GET', '/repos/nold-ai/.github/actions/jobs/126195535776/logs', headers={'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'], 'Accept': 'application/vnd.github+json', 'User-Agent': 'specfact-fixed786', 'X-GitHub-Api-Version': '2022-11-28'})
              response = connection.getresponse()
              if response.status != 302:
                  raise ValueError('original provider log unavailable to CI credential: ' + str(response.status))
              location = urllib.parse.urlsplit(response.getheader('Location'))
          finally:
              connection.close()
          if location.scheme != 'https' or location.username or location.password or location.port not in (None, 443) or location.fragment or not location.hostname or not (location.hostname.endswith('.blob.core.windows.net') or location.hostname.endswith('.actions.githubusercontent.com')):
              raise ValueError('original provider log storage host')
          connection = http.client.HTTPSConnection(location.hostname, timeout=20)
          try:
              connection.request('GET', urllib.parse.urlunsplit(('', '', location.path, location.query, '')))
              response = connection.getresponse()
              if response.status != 200:
                  raise ValueError('original provider log storage response')
              raw = response.read(30544)
          finally:
              connection.close()
          if len(raw) != 30543 or hashlib.sha256(raw).hexdigest() != '4790c54b9ecf650c9f3a92d591a9ffbc292c39497fba7cdfe7211dd5a3ae4048':
              raise ValueError('original provider log bytes')
          print('Exact live original upload log verified before signing writes.')
          PY
      - name: Create the exact reviewed checkpoints once
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_EXECUTOR: ${{ inputs.expected_executor }}
          EXPECTED_INTENT: ${{ inputs.expected_intent }}
          EXPECTED_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          env -u GH_TOKEN python -m pip install --require-hashes --only-binary=:all: --no-deps -r ci/recovery/dev-security-signer-runtime.txt
          python scripts/dev_security_ci_signer.py \
            --intent ci/recovery/dev-security-intent.json \
            --expected-executor "$EXPECTED_EXECUTOR" \
            --expected-intent "$EXPECTED_INTENT" \
            --output signer-evidence
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: dev-security-signer-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: |
            signer-evidence/intent.json
            signer-evidence/context.json
            signer-evidence/receipt.json
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: success()
        with:
          name: fixed786-native36-copy-${{ github.run_id }}-1-${{ github.sha }}
          path: signer-evidence/copy-members/
          if-no-files-found: error
