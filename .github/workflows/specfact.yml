name: PR785 isolated signing probe
on:
  workflow_dispatch:
    inputs:
      stage:
        type: choice
        options: [probe, prefix7]
        required: true
        default: probe
      expected_executor:
        type: string
        required: true
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Run bounded signing stage
        env:
          GH_TOKEN: ${{ github.token }}
          PROBE_STAGE: ${{ inputs.stage }}
          EXPECTED_EXECUTOR: ${{ inputs.expected_executor }}
          EXPECTED_MANIFEST_SHA256: 6c3d344ecb69beca59231c3c49ae05dba50790fd253db87f37122028de1dfa2a
        run: |
          env -u GH_TOKEN python -m pip install --require-hashes --only-binary=:all: --no-deps -r ci/recovery/probe-runtime-locked.txt
          python scripts/pr785_signing_recovery.py --stage "$PROBE_STAGE" --expected-executor "$EXPECTED_EXECUTOR" --output probe-evidence
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: pr785-${{ inputs.stage }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: probe-evidence/
          if-no-files-found: error
