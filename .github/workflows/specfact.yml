# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# yamllint disable rule:line-length rule:truthy
name: SpecFact CLI Windows Vendor TLS Diagnostics
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: pr786-native-preparation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-platform-proof:
    name: Native preparation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os:
        - windows-2022
    steps:
    - name: Checkout exact executor
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      with:
        ref: ${{ github.sha }}
        fetch-depth: 2
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
      with:
        python-version: '3.12'
    - name: Verify reviewed source boundary
      shell: python
      run: |
        import hashlib, json, os, subprocess
        from pathlib import Path
        assert os.environ["GITHUB_REPOSITORY"] == "nold-ai/specfact-cli"
        assert os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch"
        assert os.environ["GITHUB_REF"] == "refs/heads/codex/dev786-native-windows-vendor-log-proof-20261108"
        assert os.environ["GITHUB_RUN_ATTEMPT"] == "1"
        source = "68281c89f9823a717e1d76a18155b9f749ddbead"
        assert subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip() == os.environ["GITHUB_SHA"]
        assert subprocess.check_output(["git", "rev-parse", "HEAD^"], text=True).strip() == source
        intent_path = Path("openspec/changes/native-semgrep-cli-remediation/requirements-proof/native-platform-operation.json")
        intent = json.loads(intent_path.read_text(encoding="utf-8"))
        assert intent["kind"] == "native-platform-preparation-proof"
        assert intent["source_commit"] == source
        assert intent["workflow_sha256"] == hashlib.sha256(Path(".github/workflows/specfact.yml").read_bytes()).hexdigest()
        assert subprocess.check_output(["git", "diff", "--name-only", source, "HEAD"], text=True).splitlines() == [
            ".github/workflows/specfact.yml", intent_path.as_posix()
        ]
    - name: Install exact frozen Python and native inputs
      uses: ./.github/actions/setup-frozen-python
    - name: Observe existing vendor TLS diagnostics
      env:
        CONDUIT_DEBUG: '1'
        SEMGREP_LOG_SRCS: '^networking[.]http$,^ca-certs$,^handshake$,^tls[.]tracing$'
      shell: python
      run: |
        import os, subprocess, sys
        from pathlib import Path
        import xml.etree.ElementTree as ET
        output = Path("logs/native-preparation")
        output.mkdir(parents=True)
        assert sys.platform == "win32"
        assert "PYTEST_SEMGREP_LOG_SRCS" not in os.environ
        assert "CONDUIT_TLS" not in os.environ and "OCAML_EXTRA_CA_CERTS" not in os.environ
        paths = [
            "tests/integration/analyzers/test_native_windows_curl.py::test_windows_native_https_config_uses_explicit_ca[debug-https]",
        ]
        expected = 1
        argv = [
            sys.executable, "-m", "pytest", *paths,
            "--no-cov", "-q", "-W", "error::pytest.PytestUnhandledThreadExceptionWarning",
            "--junitxml=" + str(output / "native.xml"),
        ]
        subprocess.run(argv, check=True, timeout=120)
        suites = list(ET.parse(output / "native.xml").getroot().iter("testsuite"))
        assert sum(int(s.attrib["tests"]) for s in suites) == expected
        assert all(int(s.attrib.get(key, "0")) == 0 for s in suites for key in ("failures", "errors", "skipped"))
    - name: Build and exercise installed wheel
      shell: python
      run: |
        import hashlib, os, subprocess, sys
        from pathlib import Path
        root = Path(os.environ["GITHUB_WORKSPACE"])
        output = Path(os.environ["RUNNER_TEMP"]) / "pr786-preparation-wheel"
        assert not output.exists()
        subprocess.run([sys.executable, "-m", "build", "--wheel", "--no-isolation", "--outdir", str(output)], check=True, timeout=120)
        wheels = list(output.glob("specfact_cli-0.55.12-py3-none-any.whl"))
        assert len(wheels) == 1
        wheel = wheels[0]
        print("Built wheel SHA256", hashlib.sha256(wheel.read_bytes()).hexdigest(), flush=True)
        subprocess.run(["uv", "pip", "install", "--python", sys.executable, "--no-index", "--no-deps", str(wheel)], check=True, timeout=120)
        probe = """import sysconfig
        from pathlib import Path
        import specfact_cli
        from cffi import FFI
        from cryptography.hazmat.primitives.ciphers.aead import AESGCM
        from opentelemetry.sdk.trace import TracerProvider
        root = Path(sysconfig.get_path('purelib')).resolve()
        assert Path(specfact_cli.__file__).resolve().is_relative_to(root)
        assert specfact_cli.__version__ == '0.55.12'
        ffi = FFI()
        assert bytes(ffi.buffer(ffi.new('char[]', b'native wheel'))) == b'native wheel' + bytes([0])
        cipher = AESGCM(AESGCM.generate_key(bit_length=128))
        nonce = bytes(range(12))
        assert cipher.decrypt(nonce, cipher.encrypt(nonce, b'wheel proof', None), None) == b'wheel proof'
        provider = TracerProvider()
        with provider.get_tracer('pr786-wheel').start_as_current_span('offline'):
            pass
        provider.shutdown()
        print('Actual installed wheel runtime PASS without a network exporter')
        """
        subprocess.run([sys.executable, "-I", "-c", probe], cwd=output, check=True, timeout=30)
    - name: Render existing native delivery evidence
      shell: python
      run: |
        import subprocess, sys
        from pathlib import Path
        output = Path("logs/native-preparation")
        with (output / "pip-inspect.json").open("w", encoding="utf-8") as stream:
            subprocess.run([sys.executable, "-m", "pip", "inspect", "--local"], stdout=stream, check=True, timeout=30)
        subprocess.run([sys.executable, "scripts/render_locked_sbom.py", "--inspect", str(output / "pip-inspect.json"), "--output", str(output / "delivery.spdx.json")], check=True, timeout=30)
    - name: Upload bounded preparation reports
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: pr786-native-platform-proof-${{ matrix.os }}
        path: |-
          logs/native-preparation/native.xml
          logs/native-preparation/pip-inspect.json
          logs/native-preparation/delivery.spdx.json
        if-no-files-found: error
        retention-days: 7
