name: Dev security create-only CI signer
on:
  workflow_dispatch:
    inputs:
      expected_executor:
        type: string
        required: true
      expected_intent:
        type: string
        required: true
permissions: {}
concurrency:
  group: dev-security-create-only-signer
  cancel-in-progress: false
jobs:
  publish-test-prefix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Create the exact reviewed test prefix once
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_EXECUTOR: ${{ inputs.expected_executor }}
          EXPECTED_INTENT: ${{ inputs.expected_intent }}
          EXPECTED_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          env -u GH_TOKEN python -m pip install --require-hashes --only-binary=:all: --no-deps -r ci/recovery/dev-security-signer-runtime.txt
          python scripts/dev_security_ci_signer.py \
            --intent ci/recovery/dev-security-intent.json \
            --expected-executor "$EXPECTED_EXECUTOR" \
            --expected-intent "$EXPECTED_INTENT" \
            --output signer-evidence
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: dev-security-signer-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: signer-evidence/
          if-no-files-found: error
