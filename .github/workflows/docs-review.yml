# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# yamllint disable rule:line-length rule:truthy
name: Docs Review

on:
  pull_request:
    branches: [main, dev]
    paths:
      - "**/*.md"
      - "**/*.mdc"
      - ".github/**"
      - "docs/**"
      - "resources/**"
      - "src/specfact_cli/resources/**"
      - "docs/.doc-frontmatter-enforced"
      - "tests/unit/docs/**"
      - "tests/unit/scripts/test_doc_frontmatter/**"
      - "tests/integration/scripts/test_doc_frontmatter/**"
      - "tests/helpers/doc_frontmatter.py"
      - "tests/helpers/doc_frontmatter_fixtures.py"
      - "tests/helpers/doc_frontmatter_types.py"
      - "scripts/check-docs-commands.py"
      - "scripts/check-command-contract.py"
      - "scripts/check-documentation-accountability.py"
      - "scripts/generate-command-overview.py"
      - "docs/reference/commands.generated.*"
      - "llms.txt"
      - "scripts/check-cross-site-links.py"
      - "scripts/check_doc_frontmatter.py"
      - "scripts/validate_agent_rule_applies_when.py"
      - "scripts/check_version_sources.py"
      - "docs/agent-rules/INDEX.md"
      - "pyproject.toml"
      - "uv.lock"
      - "requirements/ci/locked.txt"
      - "ci/module-fixture.lock.json"
      - ".github/actions/setup-frozen-python/**"
      - ".github/workflows/docs-review.yml"
  push:
    branches: [main, dev]
    paths:
      - "**/*.md"
      - "**/*.mdc"
      - ".github/**"
      - "docs/**"
      - "resources/**"
      - "src/specfact_cli/resources/**"
      - "docs/.doc-frontmatter-enforced"
      - "tests/unit/docs/**"
      - "tests/unit/scripts/test_doc_frontmatter/**"
      - "tests/integration/scripts/test_doc_frontmatter/**"
      - "tests/helpers/doc_frontmatter.py"
      - "tests/helpers/doc_frontmatter_fixtures.py"
      - "tests/helpers/doc_frontmatter_types.py"
      - "scripts/check-docs-commands.py"
      - "scripts/check-command-contract.py"
      - "scripts/check-documentation-accountability.py"
      - "scripts/generate-command-overview.py"
      - "docs/reference/commands.generated.*"
      - "llms.txt"
      - "scripts/check-cross-site-links.py"
      - "scripts/check_doc_frontmatter.py"
      - "scripts/validate_agent_rule_applies_when.py"
      - "scripts/check_version_sources.py"
      - "docs/agent-rules/INDEX.md"
      - "pyproject.toml"
      - "uv.lock"
      - "requirements/ci/locked.txt"
      - "ci/module-fixture.lock.json"
      - ".github/actions/setup-frozen-python/**"
      - ".github/workflows/docs-review.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs-review:
    name: Docs Review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Read immutable module fixture
        id: modules-fixture
        shell: bash
        run: |
          set -euo pipefail
          repository="$(python -c 'import json; print(json.load(open("ci/module-fixture.lock.json", encoding="utf-8"))["repository"])')"
          commit="$(python -c 'import json; print(json.load(open("ci/module-fixture.lock.json", encoding="utf-8"))["commit"])')"
          [[ "$repository" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          test "$repository" = "nold-ai/specfact-cli-modules"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          printf 'repository=%s\n' "$repository" >> "$GITHUB_OUTPUT"
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"

      - name: Checkout module command sources
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: ${{ steps.modules-fixture.outputs.repository }}
          path: specfact-cli-modules
          ref: ${{ steps.modules-fixture.outputs.commit }}
          persist-credentials: false

      - name: Verify immutable module fixture
        shell: bash
        run: |
          set -euo pipefail
          expected_repository="$(python -c 'import json; print(json.load(open("ci/module-fixture.lock.json", encoding="utf-8"))["repository"])')"
          expected="$(python -c 'import json; print(json.load(open("ci/module-fixture.lock.json", encoding="utf-8"))["commit"])')"
          test "$expected_repository" = "${{ steps.modules-fixture.outputs.repository }}"
          actual="$(git -C specfact-cli-modules rev-parse HEAD)"
          test "$actual" = "$expected"

      - name: Export module command source path
        run: echo "SPECFACT_MODULES_REPO=${GITHUB_WORKSPACE}/specfact-cli-modules" >> "$GITHUB_ENV"

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Set up frozen documentation dependencies
        uses: ./.github/actions/setup-frozen-python

      - name: Validate docs command examples
        run: python scripts/check-docs-commands.py

      - name: Validate generated command overview
        run: python scripts/generate-command-overview.py --check

      - name: Validate generated command contract
        run: python scripts/check-command-contract.py

      - name: Validate documentation accountability
        run: python scripts/check-documentation-accountability.py

      - name: Cross-site links (warn-only; live site may lag deploys)
        continue-on-error: true
        run: python scripts/check-cross-site-links.py --warn-only

      - name: Validate documentation frontmatter (enforced paths; aligns with local docs-validate / pre-commit)
        run: python scripts/check_doc_frontmatter.py

      - name: Validate agent-rules applies_when canonical task signals
        run: python scripts/validate_agent_rule_applies_when.py

      - name: Run docs review test suites
        run: |
          mkdir -p logs/docs-review
          DOCS_REVIEW_LOG="logs/docs-review/docs-review_$(date -u +%Y%m%d_%H%M%S).log"
          python -m pytest tests/unit/docs/ tests/unit/scripts/test_doc_frontmatter/ tests/integration/scripts/test_doc_frontmatter/ -q 2>&1 | tee "$DOCS_REVIEW_LOG"
          exit "${PIPESTATUS[0]:-$?}"

      - name: Upload docs review logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-review-logs
          path: logs/docs-review/
          if-no-files-found: ignore
