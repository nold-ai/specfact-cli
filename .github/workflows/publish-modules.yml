# Publish module tarball and checksum.
#
# Triggers:
#   1. push tag (`*-v*`)              — manual release for a single module by tag
#   2. workflow_dispatch              — manual one-shot for a single module path
#   3. workflow_run (sign-modules.yml) — after bundled manifests are re-signed on
#                                        dev/main, package modules whose versions
#                                        beat the in-repo bundled-registry snapshot
#                                        and open a PR here (specfact-cli), not in
#                                        specfact-cli-modules. Marketplace registry
#                                        publishing for official bundles remains in
#                                        the modules repository.
#
name: Publish Modules

on:
  workflow_dispatch:
    inputs:
      module_path:
        description: "Path to module directory (e.g. src/specfact_cli/modules/module_registry)"
        required: true
  push:
    tags:
      - "*-v*"
  workflow_run:
    workflows: ["Module Signature Hardening"]
    types: [completed]
    branches: [dev, main]

jobs:
  publish:
    name: Validate and package module (single)
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      BUNDLED_REGISTRY_INDEX: resources/bundled-module-registry/index.json
      BUNDLED_REGISTRY_DOWNLOAD_BASE_URL: https://github.com/nold-ai/specfact-cli/releases/download
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml beartype icontract cryptography cffi packaging

      - name: Resolve module path from tag
        id: resolve
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          NAME="${TAG%-v*}"
          VERSION="${TAG##*-v}"
          echo "module_name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          NAME_NORM=$(echo "$NAME" | tr '-' '_')
          if [ -d "src/specfact_cli/modules/${NAME_NORM}" ]; then
            echo "module_path=src/specfact_cli/modules/${NAME_NORM}" >> "$GITHUB_OUTPUT"
          elif [ -d "modules/${NAME}" ]; then
            echo "module_path=modules/${NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "module_path=src/specfact_cli/modules/${NAME_NORM}" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve module path (manual)
        id: resolve_manual
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "module_path=${{ github.event.inputs.module_path }}" >> "$GITHUB_OUTPUT"

      - name: Verify checked-in module manifests (strict policy)
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source scripts/module-verify-policy.sh
          python scripts/verify-modules-signature.py "${VERIFY_MODULES_STRICT[@]}" --version-check-base "HEAD~1"

      - name: Read module metadata
        id: entry
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODULE_PATH="${{ github.event.inputs.module_path }}"
          else
            MODULE_PATH="${{ steps.resolve.outputs.module_path }}"
          fi
          python - "${MODULE_PATH}" <<'PY'
          import os
          import sys
          from pathlib import Path

          import yaml

          data = yaml.safe_load((Path(sys.argv[1]) / "module-package.yaml").read_text(encoding="utf-8"))
          module_id = str(data["name"])
          module_version = str(data["version"])
          module_slug = module_id.replace("/", "-")

          out = Path(os.environ["GITHUB_OUTPUT"])
          with out.open("a", encoding="utf-8") as fp:
              fp.write(f"module_id={module_id}\n")
              fp.write(f"module_version={module_version}\n")
              fp.write(f"module_slug={module_slug}\n")
          PY

      - name: Authenticate protected source and release identity
        id: release
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          git fetch --no-tags origin \
            "+refs/heads/dev:refs/remotes/origin/dev" \
            "+refs/heads/main:refs/remotes/origin/main"
          if ! git merge-base --is-ancestor "${SOURCE_SHA}" origin/dev && \
             ! git merge-base --is-ancestor "${SOURCE_SHA}" origin/main; then
            echo "Refusing to publish from a source outside protected dev/main history." >&2
            exit 1
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${GITHUB_REF_TYPE}" != "branch" ] || \
               { [ "${GITHUB_REF_NAME}" != "dev" ] && [ "${GITHUB_REF_NAME}" != "main" ]; }; then
              echo "Manual publication must run from protected branch dev or main." >&2
              exit 1
            fi
            SOURCE_BRANCH="${GITHUB_REF_NAME}"
            if ! git merge-base --is-ancestor "${SOURCE_SHA}" "origin/${SOURCE_BRANCH}"; then
              echo "Manual publication source is outside the selected protected branch history." >&2
              exit 1
            fi
          elif git merge-base --is-ancestor "${SOURCE_SHA}" origin/dev; then
            SOURCE_BRANCH="dev"
          else
            SOURCE_BRANCH="main"
          fi

          RELEASE_TAG="${{ steps.entry.outputs.module_slug }}-v${{ steps.entry.outputs.module_version }}"
          if [ "${{ github.event_name }}" = "push" ]; then
            if [ "${GITHUB_REF_NAME}" != "${RELEASE_TAG}" ]; then
              echo "Push tag does not match authenticated module metadata." >&2
              exit 1
            fi
            if [ "$(git rev-parse --verify "refs/tags/${GITHUB_REF_NAME}^{commit}")" != "${SOURCE_SHA}" ]; then
              echo "Push tag does not identify the authenticated source commit." >&2
              exit 1
            fi
          fi
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "Refusing to publish from a dirty checkout." >&2
            exit 1
          fi
          echo "source_sha=${SOURCE_SHA}" >> "$GITHUB_OUTPUT"
          echo "source_branch=${SOURCE_BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Package module
        id: publish
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODULE_PATH="${{ github.event.inputs.module_path }}"
          else
            MODULE_PATH="${{ steps.resolve.outputs.module_path }}"
          fi
          RELEASE_TAG="${{ steps.entry.outputs.module_slug }}-v${{ steps.entry.outputs.module_version }}"
          mkdir -p dist
          python scripts/publish-module.py "$MODULE_PATH" -o dist \
            --download-base-url "${BUNDLED_REGISTRY_DOWNLOAD_BASE_URL}/${RELEASE_TAG}" \
            --index-fragment dist/registry-entry.yaml
          git diff --exit-code -- "${MODULE_PATH}"
          if [ -n "$(git status --porcelain --untracked-files=all -- "${MODULE_PATH}")" ]; then
            echo "Module source changed while packaging." >&2
            exit 1
          fi

      - name: Publish and verify immutable release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RELEASE_TAG="${{ steps.entry.outputs.module_slug }}-v${{ steps.entry.outputs.module_version }}"
          SOURCE_SHA="${{ steps.release.outputs.source_sha }}"
          ASSET_NAME="${{ steps.entry.outputs.module_slug }}-${{ steps.entry.outputs.module_version }}.tar.gz"
          ASSET="dist/${ASSET_NAME}"
          if [ "${{ github.event_name }}" != "push" ]; then
            git push origin "${SOURCE_SHA}:refs/tags/${RELEASE_TAG}"
          fi
          if ! gh release create "${RELEASE_TAG}" "${ASSET}" "${ASSET}.sha256" \
            --repo "${{ github.repository }}" --verify-tag --title "${RELEASE_TAG}" \
            --notes "Published bundled module asset from ${SOURCE_SHA}." --latest=false; then
            echo "Release creation did not succeed; verifying an existing immutable release."
          fi

          read -r IS_DRAFT PUBLISHED_AT PUBLISHED_TAG < <(
            gh release view "${RELEASE_TAG}" --repo "${{ github.repository }}" \
              --json isDraft,publishedAt,tagName --jq '[.isDraft, (.publishedAt // ""), .tagName] | @tsv'
          )
          if [ "${IS_DRAFT}" = "true" ] || [ -z "${PUBLISHED_AT}" ]; then
            echo "Refusing to advance the snapshot from an unpublished release." >&2
            exit 1
          fi
          if [ "${PUBLISHED_TAG}" != "${RELEASE_TAG}" ]; then
            echo "Published release tag does not match authenticated module metadata." >&2
            exit 1
          fi
          git fetch --force --no-tags origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          if [ "$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")" != "${SOURCE_SHA}" ]; then
            echo "Release tag does not identify the authenticated source commit." >&2
            exit 1
          fi

          DOWNLOAD_DIR="$(mktemp -d)"
          gh release download "${RELEASE_TAG}" --repo "${{ github.repository }}" \
            --pattern "${ASSET_NAME}" --pattern "${ASSET_NAME}.sha256" --dir "${DOWNLOAD_DIR}"
          DOWNLOADED_ASSET="${DOWNLOAD_DIR}/${ASSET_NAME}"
          EXPECTED_SHA="$(cut -d ' ' -f 1 "${ASSET}.sha256")"
          PUBLISHED_SHA="$(cut -d ' ' -f 1 "${DOWNLOADED_ASSET}.sha256")"
          ACTUAL_SHA="$(sha256sum "${DOWNLOADED_ASSET}" | cut -d ' ' -f 1)"
          if [ "${PUBLISHED_SHA}" != "${EXPECTED_SHA}" ] || [ "${ACTUAL_SHA}" != "${EXPECTED_SHA}" ]; then
            echo "Published asset checksum does not match the packaged module." >&2
            exit 1
          fi

      - name: Update bundled registry snapshot (this repository)
        id: update_index
        run: |
          python scripts/update-registry-index.py \
            --index-path "${BUNDLED_REGISTRY_INDEX}" \
            --entry-fragment dist/registry-entry.yaml \
            --changed-flag /tmp/index_changed.txt
          CHANGED=$(tr -d '\n' < /tmp/index_changed.txt)
          echo "changed=${CHANGED}" >> "$GITHUB_OUTPUT"

      - name: Create bundled-registry PR (this repository)
        if: steps.update_index.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BASE="${{ steps.release.outputs.source_branch }}"
          BRANCH="auto/bundled-registry-${{ steps.entry.outputs.module_slug }}-${{ github.run_id }}"
          TITLE="chore(bundled-modules): snapshot ${{ steps.entry.outputs.module_id }} v${{ steps.entry.outputs.module_version }}"
          BODY=$'Updates `resources/bundled-module-registry/index.json` after publish-modules (bundled snapshot only; not the marketplace registry in specfact-cli-modules).\n\n- Module: `${{ steps.entry.outputs.module_id }}`\n- Version: `${{ steps.entry.outputs.module_version }}`\n- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${BRANCH}"
          git add "${BUNDLED_REGISTRY_INDEX}"
          git commit -m "${TITLE}"
          git push origin "HEAD:${BRANCH}"

          gh pr create \
            --repo "${{ github.repository }}" \
            --base "${BASE}" \
            --head "${BRANCH}" \
            --title "${TITLE}" \
            --body "${BODY}"

      - name: Upload module artifacts
        uses: actions/upload-artifact@v4
        with:
          name: module-package
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/registry-entry.yaml

  auto-publish:
    name: Package bundled modules and PR bundled-registry snapshot (after sign-modules)
    # Trigger only when sign-modules.yml completed successfully on dev/main.
    # Uses workflow_run so publishing follows the completed signing workflow,
    # independent of which push event originally changed bundled manifests.
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.head_branch == 'dev' || github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      BUNDLED_REGISTRY_INDEX: resources/bundled-module-registry/index.json
      BUNDLED_REGISTRY_DOWNLOAD_BASE_URL: https://github.com/nold-ai/specfact-cli/releases/download
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
    steps:
      - name: Checkout repository at workflow_run head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Authenticate exact workflow-run source
        id: source
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          if [ "${SOURCE_SHA}" != "${HEAD_SHA}" ]; then
            echo "Checkout does not match the triggering workflow source." >&2
            exit 1
          fi
          git fetch --no-tags origin \
            "+refs/heads/dev:refs/remotes/origin/dev" \
            "+refs/heads/main:refs/remotes/origin/main"
          if ! git merge-base --is-ancestor "${SOURCE_SHA}" origin/dev && \
             ! git merge-base --is-ancestor "${SOURCE_SHA}" origin/main; then
            echo "Refusing to publish from a source outside protected dev/main history." >&2
            exit 1
          fi
          echo "source_sha=${SOURCE_SHA}" >> "$GITHUB_OUTPUT"
          echo "source_branch=${HEAD_BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml beartype icontract cryptography cffi packaging

      - name: Verify checked-in module manifests (strict policy)
        run: |
          set -euo pipefail
          SOURCE_SHA="${{ steps.source.outputs.source_sha }}"
          # shellcheck disable=SC1091
          source scripts/module-verify-policy.sh
          python scripts/verify-modules-signature.py "${VERIFY_MODULES_STRICT[@]}" \
            --version-check-base "${SOURCE_SHA}^"

      - name: Detect modules whose version is ahead of the bundled snapshot
        id: detect
        run: |
          set -euo pipefail
          # Compare each bundled module's manifest version against
          # resources/bundled-module-registry/index.json (in-repo snapshot only).
          python scripts/_detect_modules_to_publish.py \
            --registry-index "${BUNDLED_REGISTRY_INDEX}" \
            --modules-root src/specfact_cli/modules \
            --modules-root modules \
            --output-list /tmp/modules_to_publish.txt

          if [ ! -s /tmp/modules_to_publish.txt ]; then
            echo "No modules to publish (all manifest versions are <= registry)."
            echo "modules=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "modules<<EOF"
            cat /tmp/modules_to_publish.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Package and stage registry entries
        id: stage
        if: steps.detect.outputs.modules != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p dist
          SOURCE_SHA="${{ steps.source.outputs.source_sha }}"
          PUBLISHED=()
          while IFS= read -r MODULE_DIR; do
            [ -n "${MODULE_DIR}" ] || continue
            read -r MODULE_ID MODULE_VERSION < <(
              python - "${MODULE_DIR}" <<'PY'
          import sys
          from pathlib import Path

          import yaml

          data = yaml.safe_load((Path(sys.argv[1]) / "module-package.yaml").read_text(encoding="utf-8"))
          print(data["name"], data["version"])
          PY
            )
            MODULE_SLUG="${MODULE_ID//\//-}"
            RELEASE_TAG="${MODULE_SLUG}-v${MODULE_VERSION}"
            FRAGMENT="dist/${MODULE_SLUG}-registry-entry.yaml"

            python scripts/publish-module.py "${MODULE_DIR}" -o dist \
              --download-base-url "${BUNDLED_REGISTRY_DOWNLOAD_BASE_URL}/${RELEASE_TAG}" \
              --index-fragment "${FRAGMENT}"
            git diff --exit-code -- "${MODULE_DIR}"
            if [ -n "$(git status --porcelain --untracked-files=all -- "${MODULE_DIR}")" ]; then
              echo "Module source changed while packaging." >&2
              exit 1
            fi

            ASSET_NAME="${MODULE_SLUG}-${MODULE_VERSION}.tar.gz"
            ASSET="dist/${ASSET_NAME}"
            git push origin "${SOURCE_SHA}:refs/tags/${RELEASE_TAG}"
            if ! gh release create "${RELEASE_TAG}" "${ASSET}" "${ASSET}.sha256" \
              --repo "${{ github.repository }}" --verify-tag --title "${RELEASE_TAG}" \
              --notes "Published bundled module asset from ${SOURCE_SHA}." --latest=false; then
              echo "Release creation did not succeed; verifying an existing immutable release."
            fi

            read -r IS_DRAFT PUBLISHED_AT PUBLISHED_TAG < <(
              gh release view "${RELEASE_TAG}" --repo "${{ github.repository }}" \
                --json isDraft,publishedAt,tagName --jq '[.isDraft, (.publishedAt // ""), .tagName] | @tsv'
            )
            if [ "${IS_DRAFT}" = "true" ] || [ -z "${PUBLISHED_AT}" ]; then
              echo "Refusing to advance the snapshot from an unpublished release." >&2
              exit 1
            fi
            if [ "${PUBLISHED_TAG}" != "${RELEASE_TAG}" ]; then
              echo "Published release tag does not match authenticated module metadata." >&2
              exit 1
            fi
            git fetch --force --no-tags origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
            if [ "$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")" != "${SOURCE_SHA}" ]; then
              echo "Release tag does not identify the authenticated source commit." >&2
              exit 1
            fi

            DOWNLOAD_DIR="$(mktemp -d)"
            gh release download "${RELEASE_TAG}" --repo "${{ github.repository }}" \
              --pattern "${ASSET_NAME}" --pattern "${ASSET_NAME}.sha256" --dir "${DOWNLOAD_DIR}"
            DOWNLOADED_ASSET="${DOWNLOAD_DIR}/${ASSET_NAME}"
            EXPECTED_SHA="$(cut -d ' ' -f 1 "${ASSET}.sha256")"
            PUBLISHED_SHA="$(cut -d ' ' -f 1 "${DOWNLOADED_ASSET}.sha256")"
            ACTUAL_SHA="$(sha256sum "${DOWNLOADED_ASSET}" | cut -d ' ' -f 1)"
            if [ "${PUBLISHED_SHA}" != "${EXPECTED_SHA}" ] || [ "${ACTUAL_SHA}" != "${EXPECTED_SHA}" ]; then
              echo "Published asset checksum does not match the packaged module." >&2
              exit 1
            fi

            python scripts/update-registry-index.py \
              --index-path "${BUNDLED_REGISTRY_INDEX}" \
              --entry-fragment "${FRAGMENT}" \
              --changed-flag /tmp/index_changed.txt
            CHANGED=$(tr -d '\n' < /tmp/index_changed.txt)
            if [ "${CHANGED}" = "true" ]; then
              ENTRY="$(
                python - "${FRAGMENT}" <<'PY'
          import sys
          from pathlib import Path

          import yaml

          data = yaml.safe_load(Path(sys.argv[1]).read_text(encoding="utf-8"))
          print(f"{data['id']}@{data['latest_version']}")
          PY
              )"
              PUBLISHED+=("${ENTRY}")
            fi
          done < /tmp/modules_to_publish.txt

          if [ "${#PUBLISHED[@]}" -eq 0 ]; then
            echo "Bundled registry snapshot unchanged for all detected modules; nothing to PR."
            echo "any_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf '%s\n' "${PUBLISHED[@]}" > /tmp/published_batch.txt
          echo "any_changed=true" >> "$GITHUB_OUTPUT"

      - name: Create bundled-registry PR (this repository)
        if: steps.stage.outputs.any_changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="auto/bundled-registry-batch-${HEAD_BRANCH}-${{ github.event.workflow_run.id }}"
          TITLE="chore(bundled-modules): snapshot from ${HEAD_BRANCH}@${HEAD_SHA::7}"
          {
            echo "Updates \`resources/bundled-module-registry/index.json\` after Module Signature Hardening on \`${HEAD_BRANCH}\`."
            echo "Bundled snapshot only; does not update the marketplace registry in \`specfact-cli-modules\`."
            echo
            echo "Source repo: ${{ github.server_url }}/${{ github.repository }}"
            echo "Source commit: \`${HEAD_SHA}\`"
            echo "Source run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}"
            echo
            echo "Modules packaged:"
            while IFS= read -r line; do
              [ -n "${line}" ] || continue
              echo "- \`${line}\`"
            done < /tmp/published_batch.txt
          } > /tmp/pr_body.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${BRANCH}"
          git add "${BUNDLED_REGISTRY_INDEX}"
          if git diff --cached --quiet; then
            echo "Bundled registry index has no staged changes; skipping PR creation."
            exit 0
          fi
          git commit -m "${TITLE}"
          git push origin "HEAD:${BRANCH}"

          gh pr create \
            --repo "${{ github.repository }}" \
            --base "${HEAD_BRANCH}" \
            --head "${BRANCH}" \
            --title "${TITLE}" \
            --body-file /tmp/pr_body.md

      - name: Upload module artifacts
        if: steps.stage.outputs.any_changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: module-package-batch
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*-registry-entry.yaml
