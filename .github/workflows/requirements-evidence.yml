            --requirements-run "${RUNNER_TEMP}/promotion-final-promotion/requirements-run.json" \
            --authority-run "${RUNNER_TEMP}/promotion-final-promotion/authority-run.json" \
            --artifacts "${RUNNER_TEMP}/promotion-final-promotion/artifacts.json" \
            --producer-archive "${RUNNER_TEMP}/promotion-final-promotion/producer.zip" \
            --execution-archive "${RUNNER_TEMP}/promotion-final-promotion/execution.zip" \
            --expected-attestation "${RUNNER_TEMP}/requirements-execution/requirements-promotion-reuse.json" \
            --verified-evidence-output "${RUNNER_TEMP}/final-requirements.json" \
            --output "${RUNNER_TEMP}/final-promotion-reuse.json"
          cmp --silent "${RUNNER_TEMP}/final-promotion-reuse.json" "${RUNNER_TEMP}/requirements-execution/requirements-promotion-reuse.json"
          printf 'active=true\n' >> "$GITHUB_OUTPUT"

      - name: Restore producer Requirements evidence for final verdict
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.requirements-evidence.outputs.producer-artifact-id }}
          ARTIFACT_NAME: requirements-evidence
          ARTIFACT_REPOSITORY: ${{ github.repository }}
          ARTIFACT_RUN_ID: ${{ github.run_id }}
          ARTIFACT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          ARTIFACT_EXPECTED_SHA256: ''
          ARTIFACT_DESTINATION: ${{ runner.temp }}/requirements-producer
        shell: bash
        run: *restore_exact_requirements_artifact

      - name: Download exact late RED artifact for final verification
        if: github.event.pull_request.number == 717 && github.head_ref == 'bugfix/692-promotion-final-context' && hashFiles('openspec/changes/fix-release-promotion-requirements-parity/requirements-proof/late-red-evidence.json') != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ steps.final-late-red.outputs.artifact-id }}
          path: ${{ runner.temp }}/final-late-red-artifact
          github-token: ${{ github.token }}
          run-id: ${{ steps.final-late-red.outputs.run-id }}

      - name: Normalize exact late RED proof on fresh runner
        if: github.event.pull_request.number == 717 && github.head_ref == 'bugfix/692-promotion-final-context' && hashFiles('openspec/changes/fix-release-promotion-requirements-parity/requirements-proof/late-red-evidence.json') != ''
        shell: bash
        run: |
          set -euo pipefail
          manifest="openspec/changes/fix-release-promotion-requirements-parity/requirements-proof/late-red-evidence.json"
          cycle_base_commit="$(jq -er '.cycle_base_commit | select(type == "string" and test("^[0-9a-f]{40}$"))' "$manifest")"
          trusted_provenance_root="${RUNNER_TEMP}/final-late-red-provenance"
          mkdir -p "$trusted_provenance_root" "${RUNNER_TEMP}/final-prior-red"
          git archive "$cycle_base_commit" -- scripts/requirements_proof_provenance.py | tar -x -C "$trusted_provenance_root"
          trusted_provenance="$trusted_provenance_root/scripts/requirements_proof_provenance.py"
          validator_site="${FINAL_VERIFIER_ROOT}/lib/python3.12/site-packages"
          "$FINAL_VERIFIER_ROOT/bin/python" -I -S -c \
            'import runpy, sys; sys.path.append(sys.argv.pop(1)); script = sys.argv.pop(1); runpy.run_path(script, run_name="__main__")' \
            "$validator_site" \
            scripts/requirements_late_red_proof.py \
            --manifest "$manifest" \
            --event "$GITHUB_EVENT_PATH" \
            --red-run "${RUNNER_TEMP}/final-late-red-metadata/run.json" \
            --red-artifacts "${RUNNER_TEMP}/final-late-red-metadata/artifacts.json" \
            --red-artifact-root "${RUNNER_TEMP}/final-late-red-artifact" \
            --repo-root "$GITHUB_WORKSPACE" \
            --cycle-base-ref "$cycle_base_commit" \
            --final-ref "$(git rev-parse HEAD)" \
            --trusted-provenance "$trusted_provenance" \
            --output "${RUNNER_TEMP}/final-prior-red/red.json"
          echo "FINAL_LATE_RED_PROVENANCE=$trusted_provenance" >> "$GITHUB_ENV"

      - name: Authenticate retained red proof for final verdict
        id: final-retained-red
        if: needs.requirements-evidence.outputs.prior-red-run-id != '' && (github.event.pull_request.number != 717 || github.head_ref != 'bugfix/692-promotion-final-context' || hashFiles('openspec/changes/fix-release-promotion-requirements-parity/requirements-proof/late-red-evidence.json') == '')
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PRIOR_RED_RUN_ID: ${{ needs.requirements-evidence.outputs.prior-red-run-id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PRIOR_RED_RUN_ID" =~ ^[0-9]+$ ]]
          metadata_root="${RUNNER_TEMP}/final-retained-red-metadata"
          mkdir -p "$metadata_root"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PRIOR_RED_RUN_ID}" > "$metadata_root/run.json"
          jq -e \
            --argjson run_id "$PRIOR_RED_RUN_ID" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg head_branch "$PROOF_HEAD_BRANCH" \
            --argjson proof_pull_request "$PROOF_PULL_REQUEST" \
            '.id == $run_id and
             .repository.full_name == $repository and
             .name == "Requirements Evidence" and
             .path == ".github/workflows/requirements-evidence.yml" and
             .event == "pull_request" and
             .status == "completed" and
