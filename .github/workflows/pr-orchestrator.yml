# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# yamllint disable rule:line-length rule:truthy
name: PR Orchestrator - SpecFact CLI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_PREFER_BINARY: "1"

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code_changed: ${{ steps.out.outputs.code_changed }}
      workflow_changed: ${{ steps.out.outputs.workflow_changed }}
      pyproject_changed: ${{ steps.out.outputs.pyproject_changed }}
      license_inputs_changed: ${{ steps.out.outputs.license_inputs_changed }}
      version_sources_changed: ${{ steps.out.outputs.version_sources_changed }}
      skip_expensive_tests_dev_to_main: ${{ steps.out.outputs.skip_expensive_tests_dev_to_main }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!**/*.mdc'
              - '!docs/**'
              - '!.github/workflows/**'
            pyproject:
              - 'pyproject.toml'
            license_inputs:
              - 'pyproject.toml'
              - 'modules/**/module-package.yaml'
              - 'src/specfact_cli/modules/**/module-package.yaml'
              - 'scripts/check_license_compliance.py'
              - 'scripts/license_allowlist.yaml'
              - 'scripts/module_pip_dependencies_licenses.yaml'
            version_sources:
              - 'pyproject.toml'
              - 'setup.py'
              - 'src/__init__.py'
              - 'src/specfact_cli/__init__.py'
            workflow:
              - '.github/workflows/**'
              - 'scripts/run_actionlint.sh'
              - 'scripts/yaml-tools.sh'
      - id: out
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          PR_BASE_REF="${PR_BASE_REF:-}"
          PR_HEAD_REF="${PR_HEAD_REF:-}"
          PR_BASE_SHA="${PR_BASE_SHA:-}"
          PR_HEAD_SHA="${PR_HEAD_SHA:-}"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$EVENT_NAME" = "schedule" ]; then
            {
              echo "code_changed=true"
              echo "workflow_changed=true"
              echo "pyproject_changed=true"
              echo "license_inputs_changed=true"
              echo "version_sources_changed=true"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "code_changed=${{ steps.filter.outputs.code }}"
              echo "workflow_changed=${{ steps.filter.outputs.workflow }}"
              echo "pyproject_changed=${{ steps.filter.outputs.pyproject }}"
              echo "license_inputs_changed=${{ steps.filter.outputs.license_inputs }}"
              echo "version_sources_changed=${{ steps.filter.outputs.version_sources }}"
            } >> "$GITHUB_OUTPUT"
          fi
          SKIP_EXPENSIVE_TESTS=false
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$PR_BASE_REF" = "main" ] && [ "$PR_HEAD_REF" = "dev" ]; then
            PR_BASE_REV=""
            PR_HEAD_REV=""
            MERGE_BASE=""
            if [ -n "$PR_BASE_SHA" ]; then
              PR_BASE_REV=$(git rev-parse "${PR_BASE_SHA}^{commit}" 2>/dev/null || true)
            fi
            if [ -n "$PR_HEAD_SHA" ]; then
              PR_HEAD_REV=$(git rev-parse "${PR_HEAD_SHA}^{commit}" 2>/dev/null || true)
            fi
            if [ -n "$PR_BASE_REV" ] && [ -n "$PR_HEAD_REV" ]; then
              MERGE_BASE=$(git merge-base "$PR_BASE_REV" "$PR_HEAD_REV" 2>/dev/null || true)
            fi
            if [ -n "$PR_BASE_REV" ] && [ -n "$PR_HEAD_REV" ] && [ "$PR_BASE_REV" = "$PR_HEAD_REV" ] && [ "$MERGE_BASE" = "$PR_HEAD_REV" ]; then
              SKIP_EXPENSIVE_TESTS=true
              echo "✅ Proven release parity between dev and main; skipping duplicate validation."
            else
              echo "ℹ️ Release parity proof unavailable for dev→main PR; running required validation set."
            fi
          fi
          echo "skip_expensive_tests_dev_to_main=${SKIP_EXPENSIVE_TESTS}" >> "$GITHUB_OUTPUT"

  verify-module-signatures:
    name: Verify Module Signatures
    needs: [changes]
    if: needs.changes.outputs.code_changed == 'true' || needs.changes.outputs.workflow_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install verifier dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml beartype icontract cryptography cffi

      - name: Verify bundled module manifests (dev PR relaxed; main boundary strict)
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source scripts/module-verify-policy.sh
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="origin/${{ github.event.pull_request.base.ref }}"
            if [ "${{ github.event.pull_request.base.ref }}" = "main" ]; then
              python scripts/verify-modules-signature.py "${VERIFY_MODULES_STRICT[@]}" --version-check-base "$BASE_REF"
            else
              python scripts/verify-modules-signature.py "${VERIFY_MODULES_PR[@]}" --version-check-base "$BASE_REF"
            fi
          else
            BEFORE="${{ github.event.before }}"
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              BEFORE="HEAD~1"
            fi
            if [ "${{ github.ref_name }}" = "main" ]; then
              python scripts/verify-modules-signature.py "${VERIFY_MODULES_STRICT[@]}" --version-check-base "$BEFORE"
            else
              python scripts/verify-modules-signature.py "${VERIFY_MODULES_PUSH_ORCHESTRATOR[@]}" --version-check-base "$BEFORE"
            fi
          fi

  workflow-lint:
    name: Workflow Lint
    needs: [changes]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Skip when no workflow changes are present
        if: needs.changes.outputs.workflow_changed != 'true' && github.event_name != 'workflow_dispatch'
        run: |
          echo "✅ No workflow changes detected; skipping workflow lint."

      - name: Set up Python 3.12
        if: needs.changes.outputs.workflow_changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml

      - name: Set up Go for actionlint
        if: needs.changes.outputs.workflow_changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install lint dependencies
        if: needs.changes.outputs.workflow_changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          python -m pip install --upgrade pip
          pip install "hatch" "virtualenv<21"
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.11
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run workflow lint
        if: needs.changes.outputs.workflow_changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          echo "🔍 Running actionlint for workflow changes..."
          hatch run lint-workflows

  tests:
    name: Tests (Python 3.12)
    needs: [changes, verify-module-signatures]
    if: needs.changes.outputs.code_changed == 'true'
    outputs:
      run_unit_coverage: ${{ steps.detect-unit.outputs.run_unit_coverage }}
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Skip full run (dev→main PR)
        if: needs.changes.outputs.skip_expensive_tests_dev_to_main == 'true'
        run: |
          echo "✅ Dev→main PR: tests already passed on dev; skipping full test run."

      - uses: actions/checkout@v4
        if: needs.changes.outputs.skip_expensive_tests_dev_to_main != 'true'
        with:
          fetch-depth: 0

      - name: Resolve module bundles ref
        id: modules-ref
        if: needs.changes.outputs.skip_expensive_tests_dev_to_main != 'true'
        shell: bash
        env:
          CANDIDATE_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          candidate="${CANDIDATE_REF}"
          if [ -n "$candidate" ] && git ls-remote --exit-code --heads https://github.com/nold-ai/specfact-cli-modules.git "$candidate" >/dev/null 2>&1; then
            echo "ref=$candidate" >> "$GITHUB_OUTPUT"
          else
            echo "ref=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout module bundles repo
        if: needs.changes.outputs.skip_expensive_tests_dev_to_main != 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: nold-ai/specfact-cli-modules
          path: specfact-cli-modules
          ref: ${{ steps.modules-ref.outputs.ref }}
          persist-credentials: false

      - name: Export module bundles path
        if: needs.changes.outputs.skip_expensive_tests_dev_to_main != 'true'
        run: echo "SPECFACT_MODULES_REPO=${GITHUB_WORKSPACE}/specfact-cli-modules" >> "$GITHUB_ENV"

      - name: Set up Python 3.12
        if: needs.changes.outputs.skip_expensive_tests_dev_to_main != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml

      - name: Install hatch and fallback test dependencies
        if: needs.changes.outputs.skip_expensive_tests_dev_to_main != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install "hatch" "virtualenv<21" pipx uv coverage "coverage[toml]" pytest pytest-cov pytest-mock pytest-asyncio pytest-xdist pytest-timeout
          pip install -e ".[dev]"

      - name: Verify version strings are synchronized
        if: needs.changes.outputs.skip_expensive_tests_dev_to_main != 'true'
        shell: bash
        run: |
          set -euo pipefail
          BASE=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            BEFORE="${{ github.event.before }}"
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
              BASE="$BEFORE"
            fi
          fi
          if [ -n "$BASE" ]; then
            python scripts/check_version_sources.py --changed-vs "$BASE"
          else
            python scripts/check_version_sources.py
          fi

      - name: Verify local version is ahead of PyPI
        if: >-
          needs.changes.outputs.skip_expensive_tests_dev_to_main != 'true' &&
          needs.changes.outputs.version_sources_changed == 'true'
        env:
          SPECFACT_PYPI_VERSION_CHECK_LENIENT_NETWORK: "1"
        shell: bash
        run: |
          set -euo pipefail
          BASE=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            BEFORE="${{ github.event.before }}"
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
              BASE="$BEFORE"
            fi
          fi
          if [ -n "$BASE" ]; then
            python scripts/check_local_version_ahead_of_pypi.py --skip-when-version-unchanged-vs "$BASE"
          else
            python scripts/check_local_version_ahead_of_pypi.py
          fi

      - name: Cache hatch environments
        if: needs.changes.outputs.skip_expensive_tests_dev_to_main != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
          key: ${{ runner.os }}-hatch-tests-py312-${{ hashFiles('pyproject.toml', 'src/specfact_cli/modules/*/__init__.py') }}
          restore-keys: |
            ${{ runner.os }}-hatch-tests-py312-
            ${{ runner.os }}-hatch-

      - name: Create test output directories
        if: needs.changes.outputs.skip_expensive_tests_dev_to_main != 'true'
        shell: bash
        run: |
          mkdir -p logs/tests/junit logs/tests/coverage logs/tests/workflows

      - name: Runtime discovery smoke test
        if: needs.changes.outputs.skip_expensive_tests_dev_to_main != 'true'
        shell: bash
        run: |
          python scripts/runtime_discovery_smoke.py --launcher direct --launcher hatch-source --launcher pip-editable --launcher pipx --launcher uv-run --launcher uvx

      - name: Set run_unit_coverage (or skip for dev→main)
        id: detect-unit
        shell: bash
        run: |
          if [ "${{ needs.changes.outputs.skip_expensive_tests_dev_to_main }}" = "true" ]; then
            echo "run_unit_coverage=false" >> "$GITHUB_OUTPUT"
          else
            COUNT=$(find tests/unit -name "test_*.py" 2>/dev/null | wc -l)
            if [ "$COUNT" -gt 0 ]; then
              echo "run_unit_coverage=true" >> "$GITHUB_OUTPUT"
              echo "RUN_UNIT_COVERAGE=true" >> "$GITHUB_ENV"
              echo "Detected $COUNT unit test files. Will run coverage steps."
            else
              echo "run_unit_coverage=false" >> "$GITHUB_OUTPUT"
              echo "RUN_UNIT_COVERAGE=false" >> "$GITHUB_ENV"
              echo "No unit tests detected. Skipping coverage steps."
            fi
          fi

      - name: Run full test suite (direct smart-test-full)
        if: needs.changes.outputs.skip_expensive_tests_dev_to_main != 'true'
        shell: bash
        env:
          CONTRACT_FIRST_TESTING: "true"
          TEST_MODE: "true"
          SMART_TEST_TIMEOUT_SECONDS: "1800"
          PYTEST_ADDOPTS: "-r fEw"
        run: |
          echo "🧪 Running full test suite (direct smart-test-full, Python 3.12)..."
          python tools/smart_test_coverage.py run --level full

      - name: Generate coverage XML for quality gates
        if: needs.changes.outputs.skip_expensive_tests_dev_to_main != 'true' && env.RUN_UNIT_COVERAGE == 'true'
        run: |
          python -m coverage xml -o logs/tests/coverage/coverage.xml --data-file=logs/tests/coverage/.coverage

      - name: Upload test logs
        if: needs.changes.outputs.skip_expensive_tests_dev_to_main != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: logs/tests/
          if-no-files-found: ignore

      - name: Upload coverage artifacts
        if: needs.changes.outputs.skip_expensive_tests_dev_to_main != 'true' && env.RUN_UNIT_COVERAGE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: logs/tests/coverage/coverage.xml
          if-no-files-found: error

  compat-py311:
    name: Compatibility (Python 3.11)
    runs-on: ubuntu-latest
    needs: [changes, verify-module-signatures]
    if: needs.changes.outputs.code_changed == 'true' && needs.changes.outputs.skip_expensive_tests_dev_to_main != 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Resolve module bundles ref
        id: modules-ref
        shell: bash
        env:
          CANDIDATE_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          candidate="${CANDIDATE_REF}"
          if [ -n "$candidate" ] && git ls-remote --exit-code --heads https://github.com/nold-ai/specfact-cli-modules.git "$candidate" >/dev/null 2>&1; then
            echo "ref=$candidate" >> "$GITHUB_OUTPUT"
          else
            echo "ref=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout module bundles repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: nold-ai/specfact-cli-modules
          path: specfact-cli-modules
          ref: ${{ steps.modules-ref.outputs.ref }}
          persist-credentials: false
      - name: Export module bundles path
        run: echo "SPECFACT_MODULES_REPO=${GITHUB_WORKSPACE}/specfact-cli-modules" >> "$GITHUB_ENV"
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
      - name: Install hatch
        run: |
          python -m pip install --upgrade pip
          pip install "hatch" "virtualenv<21"
      - name: Cache hatch environments
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
          key: ${{ runner.os }}-hatch-compat-py311-${{ hashFiles('pyproject.toml', 'src/specfact_cli/modules/*/__init__.py') }}
          restore-keys: |
            ${{ runner.os }}-hatch-compat-py311-
            ${{ runner.os }}-hatch-
      - name: Run Python 3.11 compatibility tests (hatch-test matrix env)
        run: |
          echo "🔁 Python 3.11 compatibility checks"
          mkdir -p logs/compat-py311
          COMPAT_LOG="logs/compat-py311/compat_$(date -u +%Y%m%d_%H%M%S).log"
          {
            hatch -e hatch-test.py3.11 run run -- -r fEw tests/unit tests/integration
            hatch -e hatch-test.py3.11 run xml || true
          } 2>&1 | tee "$COMPAT_LOG"
          exit "${PIPESTATUS[0]:-$?}"
      - name: Upload compat-py311 logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compat-py311-logs
          path: logs/compat-py311/
          if-no-files-found: ignore

  contract-first-ci:
    name: Contract-First CI
    runs-on: ubuntu-latest
    needs: [changes, verify-module-signatures]
    if: needs.changes.outputs.code_changed == 'true' && needs.changes.outputs.skip_expensive_tests_dev_to_main != 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Resolve module bundles ref
        id: modules-ref
        shell: bash
        env:
          CANDIDATE_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          candidate="${CANDIDATE_REF}"
          if [ -n "$candidate" ] && git ls-remote --exit-code --heads https://github.com/nold-ai/specfact-cli-modules.git "$candidate" >/dev/null 2>&1; then
            echo "ref=$candidate" >> "$GITHUB_OUTPUT"
          else
            echo "ref=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout module bundles repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: nold-ai/specfact-cli-modules
          path: specfact-cli-modules
          ref: ${{ steps.modules-ref.outputs.ref }}
          persist-credentials: false
      - name: Export module bundles path
        run: echo "SPECFACT_MODULES_REPO=${GITHUB_WORKSPACE}/specfact-cli-modules" >> "$GITHUB_ENV"
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "hatch" "virtualenv<21"
      - name: Cache hatch environments
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
          key: ${{ runner.os }}-hatch-contract-first-py312-${{ hashFiles('pyproject.toml', 'src/specfact_cli/modules/*/__init__.py') }}
          restore-keys: |
            ${{ runner.os }}-hatch-contract-first-py312-
            ${{ runner.os }}-hatch-
      - name: Prepare repro log directory
        run: mkdir -p logs/repro
      - name: Run contract validation and exploration
        id: repro
        run: |
          echo "🔍 Validating runtime contracts..."
          REPRO_LOG="logs/repro/repro_$(date -u +%Y%m%d_%H%M%S).log"
          echo "Running scoped contract-first validation with required CrossHair... (log: $REPRO_LOG)"
          {
            hatch run contract-test-contracts
            hatch run contract-test-exploration-fast
          } 2>&1 | tee "$REPRO_LOG"
          exit "${PIPESTATUS[0]:-$?}"
      - name: Upload repro logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repro-logs
          path: logs/repro/
          if-no-files-found: ignore
      - name: Upload repro reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repro-reports
          path: .specfact/reports/enforcement/
          if-no-files-found: ignore

  cli-validation:
    name: CLI Command Validation
    runs-on: ubuntu-latest
    needs: [changes, verify-module-signatures]
    if: needs.changes.outputs.code_changed == 'true' && needs.changes.outputs.skip_expensive_tests_dev_to_main != 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Resolve module command sources ref
        id: modules-ref
        shell: bash
        env:
          CANDIDATE_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          candidate="${CANDIDATE_REF}"
          if [ -n "$candidate" ] && git ls-remote --exit-code --heads https://github.com/nold-ai/specfact-cli-modules.git "$candidate" >/dev/null 2>&1; then
            echo "ref=$candidate" >> "$GITHUB_OUTPUT"
          else
            echo "ref=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout module command sources
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: nold-ai/specfact-cli-modules
          path: specfact-cli-modules
          ref: ${{ steps.modules-ref.outputs.ref }}
          persist-credentials: false
      - name: Export module command source path
        run: echo "SPECFACT_MODULES_REPO=${GITHUB_WORKSPACE}/specfact-cli-modules" >> "$GITHUB_ENV"
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
      - name: Build and install CLI wheel
        run: |
          echo "Building and installing SpecFact CLI wheel..."
          python -m pip install --upgrade pip
          python -m pip install "hatch" "virtualenv<21"
          hatch build
          python -m venv "$RUNNER_TEMP/specfact-cli-validation"
          # shellcheck disable=SC1091
          source "$RUNNER_TEMP/specfact-cli-validation/bin/activate"
          pip install dist/*.whl
          specfact --help
          specfact-cli --help
          deactivate
      - name: Validate CLI commands
        run: |
          echo "🔍 Validating CLI commands..."
          hatch run check-command-overview
          hatch run check-command-contract
          hatch run check-docs-commands
          echo "✅ CLI validation complete"

  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    needs: [changes, tests]
    if: needs.changes.outputs.skip_expensive_tests_dev_to_main != 'true' && needs.tests.outputs.run_unit_coverage == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
      - name: Download coverage artifacts from Tests
        uses: actions/download-artifact@v4
        with:
          name: coverage-reports
          path: logs/tests/coverage
      - name: Validate coverage artifact presence
        run: |
          test -f logs/tests/coverage/coverage.xml || (echo "❌ Missing coverage.xml" && exit 1)
          echo "✅ Found coverage.xml"
      - name: Run quality gates
        run: |
          mkdir -p logs/quality-gates
          QG_LOG="logs/quality-gates/quality-gates_$(date -u +%Y%m%d_%H%M%S).log"
          {
            echo "🔍 Checking coverage threshold..."
            COVERAGE_FAIL_UNDER=$(python - <<'PY'
          import tomllib
          from pathlib import Path

          config = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          print(int(config["tool"]["coverage"]["report"]["fail_under"]))
          PY
          )
            COVERAGE_PERCENT_INT=$(python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = ET.parse(Path("logs/tests/coverage/coverage.xml")).getroot()
          print(int(float(root.attrib.get("line-rate", "0")) * 100))
          PY
          )
            echo "📊 Line coverage: ${COVERAGE_PERCENT_INT}%"
            echo "📊 Required coverage: ${COVERAGE_FAIL_UNDER}%"
            if [ "$COVERAGE_PERCENT_INT" -lt "$COVERAGE_FAIL_UNDER" ]; then
              echo "::error::Coverage ${COVERAGE_PERCENT_INT}% is below fail_under=${COVERAGE_FAIL_UNDER}%."
              exit 1
            else
              echo "✅ Coverage threshold satisfied"
            fi
          } 2>&1 | tee "$QG_LOG"
      - name: Upload quality-gates logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gates-logs
          path: logs/quality-gates/
          if-no-files-found: ignore

  independent-static-analysis:
    name: Independent Static Analysis
    runs-on: ubuntu-latest
    needs: [changes, verify-module-signatures]
    if: needs.changes.outputs.code_changed == 'true' || needs.changes.outputs.workflow_changed == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml

      - name: Install static-analysis dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run independent Semgrep and Bandit gates
        env:
          SEMGREP_ENABLE_VERSION_CHECK: "0"
          SEMGREP_SEND_METRICS: "off"
        run: |
          mkdir -p logs/static-analysis
          hatch run semgrep-sast --json --output logs/static-analysis/semgrep.json
          hatch run semgrep-sast-gate \
            --results logs/static-analysis/semgrep.json \
            --baseline tools/semgrep/sast-baseline.json
          hatch run bandit-scan -f json -o logs/static-analysis/bandit.json

      - name: Upload independent static-analysis artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-static-analysis
          path: logs/static-analysis/
          if-no-files-found: ignore

  package-runtime-matrix:
    name: Package Runtime Matrix
    runs-on: ubuntu-latest
    needs: [changes, verify-module-signatures]
    if: needs.changes.outputs.code_changed == 'true' || needs.changes.outputs.workflow_changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        launcher: [hatch-source, pip-wheel, pipx, uv-run, uvx]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml

      - name: Install runtime validation tools
        run: |
          python -m pip install --upgrade pip
          pip install "hatch" "virtualenv<21" pipx uv

      - name: Build package wheel
        run: |
          hatch build
          ls -lh dist/*.whl

      - name: Validate runtime launcher
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "logs/package-runtime/${{ matrix.launcher }}"
          WHEEL="$(ls dist/*.whl | head -1)"
          VENV="$RUNNER_TEMP/specfact-runtime-${{ matrix.launcher }}"

          run_specfact() {
            case "${{ matrix.launcher }}" in
              hatch-source)
                hatch run specfact "$@"
                ;;
              pip-wheel)
                specfact "$@"
                ;;
              pipx)
                pipx run --python "$pythonLocation/bin/python" --spec "$WHEEL" specfact "$@"
                ;;
              uv-run)
                uv run --no-project --python "$pythonLocation/bin/python" --with "$WHEEL" specfact "$@"
                ;;
              uvx)
                uvx --from "$WHEEL" specfact "$@"
                ;;
            esac
          }

          run_specfact_cli() {
            case "${{ matrix.launcher }}" in
              hatch-source)
                hatch run specfact-cli "$@"
                ;;
              pip-wheel)
                specfact-cli "$@"
                ;;
              pipx)
                pipx run --python "$pythonLocation/bin/python" --spec "$WHEEL" specfact-cli "$@"
                ;;
              uv-run)
                uv run --no-project --python "$pythonLocation/bin/python" --with "$WHEEL" specfact-cli "$@"
                ;;
              uvx)
                uvx --from "$WHEEL" specfact-cli "$@"
                ;;
            esac
          }

          if [ "${{ matrix.launcher }}" = "pip-wheel" ]; then
            python -m venv "$VENV"
            # shellcheck disable=SC1091
            source "$VENV/bin/activate"
            pip install "$WHEEL"
          fi

          specfact --help >/dev/null 2>&1 || run_specfact --help | tee "logs/package-runtime/${{ matrix.launcher }}/specfact-help.log"
          specfact-cli --help >/dev/null 2>&1 || run_specfact_cli --help | tee "logs/package-runtime/${{ matrix.launcher }}/specfact-cli-help.log"
          run_specfact module list --show-origin | tee "logs/package-runtime/${{ matrix.launcher }}/module-list.log"
          run_specfact init ide --help | tee "logs/package-runtime/${{ matrix.launcher }}/init-ide-help.log"
          if run_specfact definitely-not-a-command >"logs/package-runtime/${{ matrix.launcher }}/unknown-command.log" 2>&1; then
            echo "::error::Unknown command unexpectedly succeeded"
            exit 1
          fi

      - name: Upload package-runtime matrix logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-runtime-${{ matrix.launcher }}
          path: logs/package-runtime/
          if-no-files-found: ignore

  runtime-smoke-macos:
    name: Runtime Discovery Smoke (macOS)
    runs-on: macos-latest
    needs: [changes, verify-module-signatures]
    if: github.event_name != 'schedule' && (needs.changes.outputs.code_changed == 'true' || needs.changes.outputs.workflow_changed == 'true')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve module bundles ref
        id: modules-ref
        shell: bash
        env:
          CANDIDATE_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          candidate="${CANDIDATE_REF}"
          if [ -n "$candidate" ] && git ls-remote --exit-code --heads https://github.com/nold-ai/specfact-cli-modules.git "$candidate" >/dev/null 2>&1; then
            echo "ref=$candidate" >> "$GITHUB_OUTPUT"
          else
            echo "ref=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout module bundles repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: nold-ai/specfact-cli-modules
          path: specfact-cli-modules
          ref: ${{ steps.modules-ref.outputs.ref }}
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml

      - name: Install smoke dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install "hatch" "virtualenv<21" pipx uv

      - name: Run macOS runtime discovery smoke
        shell: bash
        run: |
          mkdir -p logs/runtime-smoke/macos
          python scripts/runtime_discovery_smoke.py --modules-repo specfact-cli-modules --launcher direct 2>&1 | tee logs/runtime-smoke/macos/runtime-discovery.log

      - name: Upload macOS runtime-smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-smoke-macos
          path: logs/runtime-smoke/macos/
          if-no-files-found: ignore

  runtime-smoke-windows:
    name: Runtime Discovery Smoke (Windows)
    runs-on: windows-latest
    needs: [changes, verify-module-signatures]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    steps:
