  mutation-baseline:
    name: Mutation Baseline (Advisory)
    runs-on: ubuntu-latest
    needs: [changes]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml

      - name: Install mutation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install mutmut

      - name: Run targeted mutation baseline
        run: |
          mkdir -p logs/mutation
          echo "Mutation baseline targets: dependency_resolver, module_installer, module_package, marketplace_client, upgrade"
          python -m pytest tests/unit/registry/test_dependency_resolver.py tests/unit/registry/test_dependency_resolver_properties.py -q
          mutmut run \
            --paths-to-mutate src/specfact_cli/registry/dependency_resolver.py \
            --paths-to-mutate src/specfact_cli/registry/module_installer.py \
            --paths-to-mutate src/specfact_cli/registry/module_package.py \
            --paths-to-mutate src/specfact_cli/registry/marketplace_client.py \
            --paths-to-mutate src/specfact_cli/modules/upgrade/src/commands.py \
            --runner "python -m pytest tests/unit/registry -q" \
            2>&1 | tee logs/mutation/mutation-baseline.log || true
          mutmut results 2>&1 | tee logs/mutation/mutation-results.txt || true

      - name: Upload mutation baseline report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-baseline-report
          path: logs/mutation/
          if-no-files-found: ignore

  type-checking:
    name: Type Checking (basedpyright)
    runs-on: ubuntu-latest
    needs: [changes, verify-module-signatures]
    if: needs.changes.outputs.code_changed == 'true' && needs.changes.outputs.skip_expensive_tests_dev_to_main != 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
      - name: Install type-check dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run type checking
        run: |
          echo "🔍 Running basedpyright type checking..."
          mkdir -p logs/type-check
          TYPE_CHECK_LOG="logs/type-check/type-check_$(date -u +%Y%m%d_%H%M%S).log"
          python -m basedpyright --pythonpath "$(python -c 'import sys; print(sys.executable)')" 2>&1 | tee "$TYPE_CHECK_LOG"
          exit "${PIPESTATUS[0]:-$?}"
      - name: Upload type-check logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: type-check-logs
          path: logs/type-check/
          if-no-files-found: ignore

  linting:
    name: Linting (ruff, pylint, safe-write guard)
    runs-on: ubuntu-latest
    needs: [changes, verify-module-signatures]
    if: needs.changes.outputs.code_changed == 'true' && needs.changes.outputs.skip_expensive_tests_dev_to_main != 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run linting
        run: |
          echo "🔍 Running linting checks..."
          mkdir -p logs/lint
          LINT_LOG="logs/lint/lint_$(date -u +%Y%m%d_%H%M%S).log"
          {
            set -euo pipefail
            ruff format . --check
            python -m basedpyright --level error --pythonpath "$(python -c 'import sys; print(sys.executable)')"
            ruff check .
            pylint src tests tools
            python scripts/verify_safe_project_writes.py
          } 2>&1 | tee "$LINT_LOG"
          exit "${PIPESTATUS[0]:-$?}"
      - name: Upload lint logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-logs
          path: logs/lint/
          if-no-files-found: ignore

  license-check:
    name: License Compliance Gate
    runs-on: ubuntu-latest
    needs: [changes, verify-module-signatures]
    if: needs.changes.outputs.code_changed == 'true' && needs.changes.outputs.license_inputs_changed == 'true' && needs.changes.outputs.skip_expensive_tests_dev_to_main != 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run license compliance gate
        run: |
          echo "🔍 Running license compliance gate..."
          python scripts/check_license_compliance.py

  security-audit:
    name: Security Audit (pip-audit)
    runs-on: ubuntu-latest
    needs: [changes, verify-module-signatures]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run CVE security audit
        run: |
          echo "🔍 Running CVE security audit..."
          python scripts/security_audit_gate.py

  package-validation:
    name: Package Validation (uvx/pip)
    runs-on: ubuntu-latest
    needs:
      [
        tests,
        compat-py311,
        contract-first-ci,
        cli-validation,
        quality-gates,
        independent-static-analysis,
        package-runtime-matrix,
        type-checking,
        linting,
        license-check,
        security-audit,
      ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine "hatch" "virtualenv<21"

      - name: Build package
        run: |
          echo "📦 Building SpecFact CLI package..."
          hatch build
          ls -lh dist/

      - name: Validate package
        run: |
          echo "🔍 Validating package with twine..."
          twine check dist/*

      - name: Test installation
        run: |
          echo "📥 Testing pip installation..."
          pip install dist/*.whl
          specfact --version || echo "⚠️ CLI not yet fully implemented"
          pip uninstall -y specfact-cli

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [package-validation]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      published: ${{ steps.publish.outputs.published }}
      version: ${{ steps.publish.outputs.version }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine packaging
          # Note: tomllib is part of Python 3.11+ standard library
          # This project requires Python >= 3.11, so no additional TOML library needed

      - name: Make script executable
        run: chmod +x .github/workflows/scripts/check-and-publish-pypi.sh

      - name: Check version and publish to PyPI
        id: publish
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          ./.github/workflows/scripts/check-and-publish-pypi.sh
          

      - name: Summary
        if: always()
        run: |
          PUBLISHED="${{ steps.publish.outputs.published }}"
          VERSION="${{ steps.publish.outputs.version }}"

          {
            echo "## PyPI Publication Summary"
            echo "| Parameter | Value |"
            echo "|-----------|--------|"
            echo "| Version | $VERSION |"
            echo "| Published | $PUBLISHED |"
            
            if [ "$PUBLISHED" = "true" ]; then
              echo "| Status | ✅ Published to PyPI |"
            else
              echo "| Status | ⏭️ Skipped (version not newer) |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [publish-pypi]
    if: needs.publish-pypi.outputs.published == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GitHub CLI
        run: |
          type -p curl >/dev/null || (sudo apt update && sudo apt install curl -y)
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg \
          && sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg \
          && echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null \
          && sudo apt update \
          && sudo apt install gh -y

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Make scripts executable
        run: |
          chmod +x .github/workflows/scripts/generate-release-notes.sh
          chmod +x .github/workflows/scripts/create-github-release.sh
          chmod +x scripts/sign-module.sh

      - name: Sign bundled module manifests (release hardening)
        env:
          SPECFACT_MODULE_PRIVATE_SIGN_KEY: ${{ secrets.SPECFACT_MODULE_PRIVATE_SIGN_KEY }}
          SPECFACT_MODULE_PRIVATE_SIGN_KEY_PASSPHRASE: ${{ secrets.SPECFACT_MODULE_PRIVATE_SIGN_KEY_PASSPHRASE }}
        run: |
          if [ -z "${SPECFACT_MODULE_PRIVATE_SIGN_KEY}" ]; then
            echo "❌ Missing required secret: SPECFACT_MODULE_PRIVATE_SIGN_KEY"
            exit 1
          fi
          if [ -z "${SPECFACT_MODULE_PRIVATE_SIGN_KEY_PASSPHRASE}" ]; then
            echo "❌ Missing required secret: SPECFACT_MODULE_PRIVATE_SIGN_KEY_PASSPHRASE"
            exit 1
          fi
          python -m pip install --upgrade pip
          python -m pip install pyyaml beartype icontract cryptography cffi
          python - <<'PY'
          import beartype
          import cffi
          import cryptography
          import icontract
          import yaml

          print("✅ signing dependencies available:", yaml.__version__, cryptography.__version__, cffi.__version__, beartype.__version__, icontract.__version__)
          PY
          BASE_REF="${{ github.event.before }}"
          if [ -z "$BASE_REF" ] || [ "$BASE_REF" = "0000000000000000000000000000000000000000" ]; then
            BASE_REF="HEAD~1"
          fi
          git rev-parse --verify "$BASE_REF" >/dev/null 2>&1 || BASE_REF="HEAD~1"
          echo "Using module-signing base ref: $BASE_REF"
          python scripts/sign-modules.py --changed-only --base-ref "$BASE_REF" --bump-version patch --payload-from-filesystem

      - name: Get version from PyPI publish step
        id: get_version
        run: |
          # Use version from publish-pypi job output
          VERSION="${{ needs.publish-pypi.outputs.version }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "📦 Version: $VERSION"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          echo "🚀 Creating GitHub release for version $VERSION..."
          ./.github/workflows/scripts/create-github-release.sh "$VERSION"

      - name: Release Summary
        if: always()
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          {
            echo "## GitHub Release Summary"
            echo "| Parameter | Value |"
            echo "|-----------|--------|"
            echo "| Version | $VERSION |"
            echo "| Status | ✅ Release created |"
            echo "| URL | https://github.com/${{ github.repository }}/releases/tag/v${VERSION} |"
          } >> "$GITHUB_STEP_SUMMARY"
