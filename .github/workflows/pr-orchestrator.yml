      - name: Install smoke dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Windows runtime discovery smoke
        shell: bash
        run: |
          mkdir -p logs/runtime-smoke/windows
          python scripts/runtime_discovery_smoke.py --modules-repo specfact-cli-modules --launcher direct 2>&1 | tee logs/runtime-smoke/windows/runtime-discovery.log

      - name: Upload Windows runtime-smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-smoke-windows
          path: logs/runtime-smoke/windows/
