  reproducible-delivery:
    name: Reproducible Delivery Evidence
    runs-on: ubuntu-latest
    needs: [changes, verify-module-signatures]
    if: needs.changes.outputs.code_changed == 'true' || needs.changes.outputs.workflow_changed == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Set up frozen delivery dependencies
        uses: ./.github/actions/setup-frozen-python

      - name: Verify committed frozen inputs
        run: python scripts/check_reproducible_delivery.py

      - name: Build package once
        run: uv build --wheel --no-build-isolation

      - name: Prove two locked wheel installs agree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs/reproducible-delivery
          WHEEL="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$WHEEL"
          for run in first second; do
            VENV="$RUNNER_TEMP/specfact-repro-${run}"
            python -m venv "$VENV"
            "$VENV/bin/python" -m pip install --require-hashes -r requirements/ci/locked.txt
            "$VENV/bin/python" -m pip install --no-deps "$WHEEL"
            "$VENV/bin/specfact" --version
            "$VENV/bin/python" -m pip inspect --local > "logs/reproducible-delivery/${run}.json"
            python scripts/render_locked_sbom.py \
              --inspect "logs/reproducible-delivery/${run}.json" \
              --output "logs/reproducible-delivery/${run}.sbom.json"
          done
          python - \
            "logs/reproducible-delivery/first.json" \
            "logs/reproducible-delivery/second.json" \
            "logs/reproducible-delivery/first.sbom.json" \
            "logs/reproducible-delivery/second.sbom.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          def stable(path: str) -> str:
              payload = json.loads(Path(path).read_text(encoding="utf-8"))
              if isinstance(payload.get("installed"), list):
                  # ``pip inspect`` includes installer-specific metadata (for
                  # example, requested-by relationships).  The locked-delivery
                  # proof compares the resolved package identities; the full
                  # raw reports remain uploaded as operator evidence.
                  installed = [
                      {
                          "name": item["metadata"]["name"].lower(),
                          "version": item["metadata"]["version"],
                      }
                      for item in payload["installed"]
                  ]
                  return json.dumps(
                      sorted(installed, key=lambda item: item["name"]),
                      sort_keys=True,
                      separators=(",", ":"),
                  )
              payload.pop("environment", None)
              payload.pop("serialNumber", None)
              if isinstance(payload.get("metadata"), dict):
                  payload["metadata"].pop("timestamp", None)
              return json.dumps(payload, sort_keys=True, separators=(",", ":"))

          if stable(sys.argv[1]) != stable(sys.argv[2]):
              raise SystemExit("locked wheel environments differ")
          if stable(sys.argv[3]) != stable(sys.argv[4]):
              raise SystemExit("locked wheel SBOMs differ")
          PY

      - name: Upload reproducible-delivery evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: reproducible-delivery
          path: logs/reproducible-delivery/
          if-no-files-found: error

  dependency-compatibility:
    name: Dependency Compatibility (Advisory)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Read immutable module fixture
        id: compatibility-modules-fixture
        shell: bash
        run: |
          set -euo pipefail
          fixture_ref="$(python -c 'import json; print(json.load(open("ci/module-fixture.lock.json", encoding="utf-8"))["commit"])')"
          fixture_tree="$(python -c 'import json; print(json.load(open("ci/module-fixture.lock.json", encoding="utf-8"))["tree"])')"
          echo "ref=${fixture_ref}" >> "$GITHUB_OUTPUT"
          echo "tree=${fixture_tree}" >> "$GITHUB_OUTPUT"

      - name: Checkout module bundles repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          repository: nold-ai/specfact-cli-modules
          path: specfact-cli-modules
          ref: ${{ steps.compatibility-modules-fixture.outputs.ref }}

      - name: Verify immutable module fixture
        shell: bash
        run: |
          set -euo pipefail
          expected="$(python -c 'import json; print(json.load(open("ci/module-fixture.lock.json", encoding="utf-8"))["commit"])')"
          actual="$(git -C specfact-cli-modules rev-parse HEAD)"
          expected_tree="${{ steps.compatibility-modules-fixture.outputs.tree }}"
          actual_tree="$(git -C specfact-cli-modules rev-parse 'HEAD^{tree}')"
          test "$actual" = "$expected"
          test "$actual_tree" = "$expected_tree"

      - name: Export module bundles path
        run: echo "SPECFACT_MODULES_REPO=${GITHUB_WORKSPACE}/specfact-cli-modules" >> "$GITHUB_ENV"

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Set up frozen baseline dependencies
        uses: ./.github/actions/setup-frozen-python

      - name: Exercise latest and lower-bound resolver lanes
        shell: bash
        run: |
          set -euo pipefail
          compatibility_deselections=(
            --deselect=tests/unit/scripts/test_dependency_trust_review.py
            --deselect=tests/unit/scripts/test_reproducible_delivery.py
          )
          uv lock --upgrade
          uv sync --locked --all-extras
          python -m pytest -q "${compatibility_deselections[@]}" tests/unit
          uv lock --resolution lowest-direct
          uv sync --locked --all-extras --resolution lowest-direct
          python -m pytest -q "${compatibility_deselections[@]}" tests/unit

  package-validation:
    name: Package Validation (uvx/pip)
    runs-on: ubuntu-latest
    needs:
      [
        tests,
        compat-py311,
        contract-first-ci,
        cli-validation,
        quality-gates,
        independent-static-analysis,
        package-runtime-matrix,
        reproducible-delivery,
        type-checking,
        linting,
        license-check,
        security-audit,
        dependency-trust,
      ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Set up frozen release dependencies
        uses: ./.github/actions/setup-frozen-python

      - name: Build package
        run: |
          echo "📦 Building SpecFact CLI package..."
          uv build --wheel
          ls -lh dist/

      - name: Validate package
        run: |
          echo "🔍 Validating package with twine..."
          twine check dist/*

      - name: Test installation
        shell: bash
        run: |
          set -euo pipefail
          echo "📥 Testing pip installation..."
          RELEASE_VENV="$RUNNER_TEMP/specfact-release-wheel"
          python -m venv "$RELEASE_VENV"
          "$RELEASE_VENV/bin/python" -m pip install --require-hashes -r requirements/ci/locked.txt
          "$RELEASE_VENV/bin/python" -m pip install --no-deps dist/*.whl
          "$RELEASE_VENV/bin/specfact" --version

      - name: Upload package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: python-package
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [package-validation]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      published: ${{ steps.publish.outputs.published }}
      version: ${{ steps.publish.outputs.version }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Set up frozen publication dependencies
        uses: ./.github/actions/setup-frozen-python

      - name: Download tested package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: python-package
          path: dist

      - name: Make script executable
        run: chmod +x .github/workflows/scripts/check-and-publish-pypi.sh

      - name: Check version and publish to PyPI
        id: publish
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          ./.github/workflows/scripts/check-and-publish-pypi.sh
          

      - name: Summary
        if: always()
        run: |
          PUBLISHED="${{ steps.publish.outputs.published }}"
          VERSION="${{ steps.publish.outputs.version }}"

          {
            echo "## PyPI Publication Summary"
            echo "| Parameter | Value |"
            echo "|-----------|--------|"
            echo "| Version | $VERSION |"
            echo "| Published | $PUBLISHED |"
            
            if [ "$PUBLISHED" = "true" ]; then
              echo "| Status | ✅ Published to PyPI |"
            else
              echo "| Status | ⏭️ Skipped (version not newer) |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [publish-pypi]
    if: needs.publish-pypi.outputs.published == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install GitHub CLI
        run: |
          type -p curl >/dev/null || (sudo apt update && sudo apt install curl -y)
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg \
          && sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg \
          && echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null \
          && sudo apt update \
          && sudo apt install gh -y

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Set up frozen release signing dependencies
        uses: ./.github/actions/setup-frozen-python

      - name: Make scripts executable
        run: |
          chmod +x .github/workflows/scripts/generate-release-notes.sh
          chmod +x .github/workflows/scripts/create-github-release.sh
          chmod +x scripts/sign-module.sh

      - name: Sign bundled module manifests (release hardening)
        env:
          SPECFACT_MODULE_PRIVATE_SIGN_KEY: ${{ secrets.SPECFACT_MODULE_PRIVATE_SIGN_KEY }}
          SPECFACT_MODULE_PRIVATE_SIGN_KEY_PASSPHRASE: ${{ secrets.SPECFACT_MODULE_PRIVATE_SIGN_KEY_PASSPHRASE }}
        run: |
          if [ -z "${SPECFACT_MODULE_PRIVATE_SIGN_KEY}" ]; then
            echo "❌ Missing required secret: SPECFACT_MODULE_PRIVATE_SIGN_KEY"
            exit 1
          fi
          if [ -z "${SPECFACT_MODULE_PRIVATE_SIGN_KEY_PASSPHRASE}" ]; then
            echo "❌ Missing required secret: SPECFACT_MODULE_PRIVATE_SIGN_KEY_PASSPHRASE"
            exit 1
          fi
          python - <<'PY'
          import beartype
          import cffi
          import cryptography
          import icontract
          import yaml

          print("✅ signing dependencies available:", yaml.__version__, cryptography.__version__, cffi.__version__, beartype.__version__, icontract.__version__)
          PY
          BASE_REF="${{ github.event.before }}"
          if [ -z "$BASE_REF" ] || [ "$BASE_REF" = "0000000000000000000000000000000000000000" ]; then
            BASE_REF="HEAD~1"
          fi
          git rev-parse --verify "$BASE_REF" >/dev/null 2>&1 || BASE_REF="HEAD~1"
          echo "Using module-signing base ref: $BASE_REF"
          python scripts/sign-modules.py --changed-only --base-ref "$BASE_REF" --bump-version patch --payload-from-filesystem

      - name: Get version from PyPI publish step
        id: get_version
        run: |
          # Use version from publish-pypi job output
          VERSION="${{ needs.publish-pypi.outputs.version }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "📦 Version: $VERSION"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          echo "🚀 Creating GitHub release for version $VERSION..."
          ./.github/workflows/scripts/create-github-release.sh "$VERSION"

      - name: Release Summary
        if: always()
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          {
            echo "## GitHub Release Summary"
            echo "| Parameter | Value |"
            echo "|-----------|--------|"
            echo "| Version | $VERSION |"
            echo "| Status | ✅ Release created |"
            echo "| URL | https://github.com/${{ github.repository }}/releases/tag/v${VERSION} |"
          } >> "$GITHUB_STEP_SUMMARY"
