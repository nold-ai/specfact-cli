# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# yamllint disable rule:line-length rule:truthy
name: PR Orchestrator - SpecFact CLI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  schedule:
    - cron: "17 3 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PIP_PREFER_BINARY: "1"

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code_changed: ${{ steps.out.outputs.code_changed }}
      workflow_changed: ${{ steps.out.outputs.workflow_changed }}
      pyproject_changed: ${{ steps.out.outputs.pyproject_changed }}
      license_inputs_changed: ${{ steps.out.outputs.license_inputs_changed }}
      version_sources_changed: ${{ steps.out.outputs.version_sources_changed }}
      skip_expensive_tests_dev_to_main: ${{ steps.out.outputs.skip_expensive_tests_dev_to_main }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d
        id: filter
        with:
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!**/*.mdc'
              - '!docs/**'
              - '!.github/workflows/**'
            pyproject:
              - 'pyproject.toml'
            license_inputs:
              - 'pyproject.toml'
              - 'uv.lock'
              - 'requirements/ci/locked.txt'
              - 'requirements/code-review/requirements.in'
              - 'requirements/code-review/locked.txt'
              - 'modules/**/module-package.yaml'
              - 'src/specfact_cli/modules/**/module-package.yaml'
              - 'scripts/check_license_compliance.py'
              - 'scripts/license_scope_policy.py'
              - 'scripts/check_dependency_trust_exceptions.py'
              - 'scripts/license_allowlist.yaml'
              - 'ci/dependency-trust-exceptions.json'
              - 'scripts/module_pip_dependencies_licenses.yaml'
            version_sources:
              - 'pyproject.toml'
              - 'setup.py'
              - 'src/__init__.py'
              - 'src/specfact_cli/__init__.py'
            workflow:
              - '.github/workflows/**'
              - 'scripts/run_actionlint.sh'
              - 'scripts/yaml-tools.sh'
      - id: out
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          PR_BASE_REF="${PR_BASE_REF:-}"
          PR_HEAD_REF="${PR_HEAD_REF:-}"
          PR_BASE_SHA="${PR_BASE_SHA:-}"
          PR_HEAD_SHA="${PR_HEAD_SHA:-}"
          if [ "$EVENT_NAME" = "schedule" ]; then
            {
              echo "code_changed=true"
              echo "workflow_changed=true"
              echo "pyproject_changed=true"
              echo "license_inputs_changed=true"
              echo "version_sources_changed=true"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "code_changed=${{ steps.filter.outputs.code }}"
              echo "workflow_changed=${{ steps.filter.outputs.workflow }}"
              echo "pyproject_changed=${{ steps.filter.outputs.pyproject }}"
              echo "license_inputs_changed=${{ steps.filter.outputs.license_inputs }}"
              echo "version_sources_changed=${{ steps.filter.outputs.version_sources }}"
            } >> "$GITHUB_OUTPUT"
          fi
          SKIP_EXPENSIVE_TESTS=false
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$PR_BASE_REF" = "main" ] && [ "$PR_HEAD_REF" = "dev" ]; then
            PR_BASE_REV=""
            PR_HEAD_REV=""
            MERGE_BASE=""
            if [ -n "$PR_BASE_SHA" ]; then
              PR_BASE_REV=$(git rev-parse "${PR_BASE_SHA}^{commit}" 2>/dev/null || true)
            fi
            if [ -n "$PR_HEAD_SHA" ]; then
              PR_HEAD_REV=$(git rev-parse "${PR_HEAD_SHA}^{commit}" 2>/dev/null || true)
            fi
            if [ -n "$PR_BASE_REV" ] && [ -n "$PR_HEAD_REV" ]; then
              MERGE_BASE=$(git merge-base "$PR_BASE_REV" "$PR_HEAD_REV" 2>/dev/null || true)
            fi
            if [ -n "$PR_BASE_REV" ] && [ -n "$PR_HEAD_REV" ] && [ "$PR_BASE_REV" = "$PR_HEAD_REV" ] && [ "$MERGE_BASE" = "$PR_HEAD_REV" ]; then
              SKIP_EXPENSIVE_TESTS=true
              echo "✅ Proven release parity between dev and main; skipping duplicate validation."
            else
              echo "ℹ️ Release parity proof unavailable for dev→main PR; running required validation set."
            fi
          fi
          echo "skip_expensive_tests_dev_to_main=${SKIP_EXPENSIVE_TESTS}" >> "$GITHUB_OUTPUT"

  verify-module-signatures:
    name: Verify Module Signatures
    needs: [changes]
    if: needs.changes.outputs.code_changed == 'true' || needs.changes.outputs.workflow_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Set up frozen verifier dependencies
        uses: ./.github/actions/setup-frozen-python

      - name: Verify bundled module manifests (dev PR relaxed; main boundary strict)
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          BEFORE_SHA: ${{ github.event.before }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source scripts/module-verify-policy.sh
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            BASE_REF="origin/${PR_BASE_REF}"
            if [ "${PR_BASE_REF}" = "main" ]; then
              python scripts/verify-modules-signature.py "${VERIFY_MODULES_STRICT[@]}" --version-check-base "$BASE_REF"
            else
              python scripts/verify-modules-signature.py "${VERIFY_MODULES_PR[@]}" --version-check-base "$BASE_REF"
            fi
          else
            BEFORE="${BEFORE_SHA}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              BEFORE="HEAD~1"
            fi
            if [ "${REF_NAME}" = "main" ]; then
              python scripts/verify-modules-signature.py "${VERIFY_MODULES_STRICT[@]}" --version-check-base "$BEFORE"
            else
              python scripts/verify-modules-signature.py "${VERIFY_MODULES_PUSH_ORCHESTRATOR[@]}" --version-check-base "$BEFORE"
            fi
          fi

  workflow-lint:
    name: Workflow Lint
    needs: [changes]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Skip when no workflow changes are present
        if: needs.changes.outputs.workflow_changed != 'true'
        run: |
          echo "✅ No workflow changes detected; skipping workflow lint."

      - name: Set up Python 3.12
        if: needs.changes.outputs.workflow_changed == 'true'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Set up frozen lint dependencies
        if: needs.changes.outputs.workflow_changed == 'true'
        uses: ./.github/actions/setup-frozen-python

      - name: Set up Go for actionlint
        if: needs.changes.outputs.workflow_changed == 'true'
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: "1.24"
          cache: false

      - name: Install pinned actionlint
        if: needs.changes.outputs.workflow_changed == 'true'
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.11
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run workflow lint
        if: needs.changes.outputs.workflow_changed == 'true'
        run: |
          echo "🔍 Running actionlint for workflow changes..."
          bash scripts/run_actionlint.sh

  tests:
    name: Tests (Python 3.12)
    needs: [changes, verify-module-signatures]
    if: needs.changes.outputs.code_changed == 'true'
    outputs:
      run_unit_coverage: ${{ steps.detect-unit.outputs.run_unit_coverage }}
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Skip full run (dev→main PR)
        if: needs.changes.outputs.skip_expensive_tests_dev_to_main == 'true'
        run: |
          echo "✅ Dev→main PR: tests already passed on dev; skipping full test run."

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        if: needs.changes.outputs.skip_expensive_tests_dev_to_main != 'true'
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Read immutable module fixture
        id: modules-fixture
        if: needs.changes.outputs.skip_expensive_tests_dev_to_main != 'true'
        shell: bash
        run: |
          set -euo pipefail
          fixture_ref="$(python -c 'import json; print(json.load(open("ci/module-fixture.lock.json", encoding="utf-8"))["commit"])')"
          echo "ref=${fixture_ref}" >> "$GITHUB_OUTPUT"

      - name: Checkout module bundles repo
        if: needs.changes.outputs.skip_expensive_tests_dev_to_main != 'true'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          repository: nold-ai/specfact-cli-modules
          path: specfact-cli-modules
          ref: ${{ steps.modules-fixture.outputs.ref }}

      - name: Export module bundles path
        if: needs.changes.outputs.skip_expensive_tests_dev_to_main != 'true'
        run: echo "SPECFACT_MODULES_REPO=${GITHUB_WORKSPACE}/specfact-cli-modules" >> "$GITHUB_ENV"

      - name: Verify immutable module fixture
        if: needs.changes.outputs.skip_expensive_tests_dev_to_main != 'true'
        shell: bash
        run: |
          set -euo pipefail
          expected="$(python -c 'import json; print(json.load(open("ci/module-fixture.lock.json", encoding="utf-8"))["commit"])')"
          actual="$(git -C specfact-cli-modules rev-parse HEAD)"
          test "$actual" = "$expected"

      - name: Set up Python 3.12
        if: needs.changes.outputs.skip_expensive_tests_dev_to_main != 'true'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Set up frozen test dependencies
        if: needs.changes.outputs.skip_expensive_tests_dev_to_main != 'true'
        uses: ./.github/actions/setup-frozen-python

      - name: Verify version strings are synchronized
        if: needs.changes.outputs.skip_expensive_tests_dev_to_main != 'true'
        shell: bash
        run: |
          set -euo pipefail
          BASE=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            BEFORE="${{ github.event.before }}"
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
              BASE="$BEFORE"
            fi
          fi
          if [ -n "$BASE" ]; then
            python scripts/check_version_sources.py --changed-vs "$BASE"
          else
            python scripts/check_version_sources.py
          fi

      - name: Verify local version is ahead of PyPI
        if: >-
          needs.changes.outputs.skip_expensive_tests_dev_to_main != 'true' &&
          needs.changes.outputs.version_sources_changed == 'true'
        env:
          SPECFACT_PYPI_VERSION_CHECK_LENIENT_NETWORK: "1"
        shell: bash
        run: |
          set -euo pipefail
          BASE=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            BEFORE="${{ github.event.before }}"
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
              BASE="$BEFORE"
            fi
          fi
          if [ -n "$BASE" ]; then
            python scripts/check_local_version_ahead_of_pypi.py --skip-when-version-unchanged-vs "$BASE"
          else
            python scripts/check_local_version_ahead_of_pypi.py
          fi

      - name: Create test output directories
        if: needs.changes.outputs.skip_expensive_tests_dev_to_main != 'true'
        shell: bash
        run: |
          mkdir -p logs/tests/junit logs/tests/coverage logs/tests/workflows

      - name: Runtime discovery smoke test
        if: needs.changes.outputs.skip_expensive_tests_dev_to_main != 'true'
        shell: bash
        run: |
          python scripts/runtime_discovery_smoke.py --launcher direct --launcher console

      - name: Set run_unit_coverage (or skip for dev→main)
        id: detect-unit
        shell: bash
        run: |
          if [ "${{ needs.changes.outputs.skip_expensive_tests_dev_to_main }}" = "true" ]; then
            echo "run_unit_coverage=false" >> "$GITHUB_OUTPUT"
          else
            COUNT=$(find tests/unit -name "test_*.py" 2>/dev/null | wc -l)
            if [ "$COUNT" -gt 0 ]; then
              echo "run_unit_coverage=true" >> "$GITHUB_OUTPUT"
              echo "RUN_UNIT_COVERAGE=true" >> "$GITHUB_ENV"
              echo "Detected $COUNT unit test files. Will run coverage steps."
            else
              echo "run_unit_coverage=false" >> "$GITHUB_OUTPUT"
              echo "RUN_UNIT_COVERAGE=false" >> "$GITHUB_ENV"
              echo "No unit tests detected. Skipping coverage steps."
            fi
          fi

      - name: Run full test suite (direct smart-test-full)
        if: needs.changes.outputs.skip_expensive_tests_dev_to_main != 'true'
        shell: bash
        env:
          CONTRACT_FIRST_TESTING: "true"
          TEST_MODE: "true"
          SMART_TEST_TIMEOUT_SECONDS: "1800"
          PYTEST_ADDOPTS: "-r fEw"
        run: |
          echo "🧪 Running full test suite (direct smart-test-full, Python 3.12)..."
          python tools/smart_test_coverage.py run --level full

      - name: Generate coverage XML for quality gates
        if: needs.changes.outputs.skip_expensive_tests_dev_to_main != 'true' && env.RUN_UNIT_COVERAGE == 'true'
        run: |
          python -m coverage xml -o logs/tests/coverage/coverage.xml --data-file=logs/tests/coverage/.coverage

      - name: Upload test logs
        if: needs.changes.outputs.skip_expensive_tests_dev_to_main != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: test-logs
          path: logs/tests/
          if-no-files-found: ignore

      - name: Upload coverage artifacts
        if: needs.changes.outputs.skip_expensive_tests_dev_to_main != 'true' && env.RUN_UNIT_COVERAGE == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-reports
          path: logs/tests/coverage/coverage.xml
          if-no-files-found: error

  compat-py311:
    name: Compatibility (Python 3.11)
    runs-on: ubuntu-latest
    needs: [changes, verify-module-signatures]
    if: needs.changes.outputs.code_changed == 'true' && needs.changes.outputs.skip_expensive_tests_dev_to_main != 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Read immutable module fixture
        id: modules-fixture
        shell: bash
        run: |
          set -euo pipefail
          fixture_ref="$(python -c 'import json; print(json.load(open("ci/module-fixture.lock.json", encoding="utf-8"))["commit"])')"
          echo "ref=${fixture_ref}" >> "$GITHUB_OUTPUT"

      - name: Checkout module bundles repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          repository: nold-ai/specfact-cli-modules
          path: specfact-cli-modules
          ref: ${{ steps.modules-fixture.outputs.ref }}
      - name: Export module bundles path
        run: echo "SPECFACT_MODULES_REPO=${GITHUB_WORKSPACE}/specfact-cli-modules" >> "$GITHUB_ENV"
      - name: Verify immutable module fixture
        shell: bash
        run: |
          set -euo pipefail
          expected="$(python -c 'import json; print(json.load(open("ci/module-fixture.lock.json", encoding="utf-8"))["commit"])')"
          actual="$(git -C specfact-cli-modules rev-parse HEAD)"
          test "$actual" = "$expected"
      - name: Set up Python 3.11
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"
      - name: Set up frozen compatibility dependencies
        uses: ./.github/actions/setup-frozen-python
      - name: Run Python 3.11 compatibility tests
        run: |
          echo "🔁 Python 3.11 compatibility checks"
          mkdir -p logs/compat-py311
          COMPAT_LOG="logs/compat-py311/compat_$(date -u +%Y%m%d_%H%M%S).log"
          {
            python -m pytest -r fEw tests/unit tests/integration
            python -m coverage xml -o logs/compat-py311/coverage.xml || true
          } 2>&1 | tee "$COMPAT_LOG"
          exit "${PIPESTATUS[0]:-$?}"
      - name: Upload compat-py311 logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: compat-py311-logs
          path: logs/compat-py311/
          if-no-files-found: ignore

  contract-first-ci:
    name: Contract-First CI
    runs-on: ubuntu-latest
    needs: [changes, verify-module-signatures]
    if: needs.changes.outputs.code_changed == 'true' && needs.changes.outputs.skip_expensive_tests_dev_to_main != 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Read immutable module fixture
        id: modules-fixture
        shell: bash
        run: |
          set -euo pipefail
          fixture_ref="$(python -c 'import json; print(json.load(open("ci/module-fixture.lock.json", encoding="utf-8"))["commit"])')"
          echo "ref=${fixture_ref}" >> "$GITHUB_OUTPUT"

      - name: Checkout module bundles repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          repository: nold-ai/specfact-cli-modules
          path: specfact-cli-modules
          ref: ${{ steps.modules-fixture.outputs.ref }}
      - name: Export module bundles path
        run: echo "SPECFACT_MODULES_REPO=${GITHUB_WORKSPACE}/specfact-cli-modules" >> "$GITHUB_ENV"
      - name: Verify immutable module fixture
        shell: bash
        run: |
          set -euo pipefail
          expected="$(python -c 'import json; print(json.load(open("ci/module-fixture.lock.json", encoding="utf-8"))["commit"])')"
          actual="$(git -C specfact-cli-modules rev-parse HEAD)"
          test "$actual" = "$expected"
      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - name: Set up frozen contract dependencies
        uses: ./.github/actions/setup-frozen-python
      - name: Prepare repro log directory
        run: mkdir -p logs/repro
      - name: Run contract validation and exploration
        id: repro
        run: |
          echo "🔍 Validating runtime contracts..."
          REPRO_LOG="logs/repro/repro_$(date -u +%Y%m%d_%H%M%S).log"
          echo "Running scoped contract-first validation with required CrossHair... (log: $REPRO_LOG)"
          {
            python tools/contract_first_smart_test.py contracts
            python tools/contract_first_smart_test.py exploration --crosshair-fast
          } 2>&1 | tee "$REPRO_LOG"
          exit "${PIPESTATUS[0]:-$?}"
      - name: Upload repro logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: repro-logs
          path: logs/repro/
          if-no-files-found: ignore
      - name: Upload repro reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: repro-reports
          path: .specfact/reports/enforcement/
          if-no-files-found: ignore

  cli-validation:
    name: CLI Command Validation
    runs-on: ubuntu-latest
    needs: [changes, verify-module-signatures]
    if: needs.changes.outputs.code_changed == 'true' && needs.changes.outputs.skip_expensive_tests_dev_to_main != 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Read immutable module fixture
        id: modules-fixture
        shell: bash
        run: |
          set -euo pipefail
          fixture_ref="$(python -c 'import json; print(json.load(open("ci/module-fixture.lock.json", encoding="utf-8"))["commit"])')"
          echo "ref=${fixture_ref}" >> "$GITHUB_OUTPUT"

      - name: Checkout module command sources
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          repository: nold-ai/specfact-cli-modules
          path: specfact-cli-modules
          ref: ${{ steps.modules-fixture.outputs.ref }}
      - name: Export module command source path
        run: echo "SPECFACT_MODULES_REPO=${GITHUB_WORKSPACE}/specfact-cli-modules" >> "$GITHUB_ENV"
      - name: Verify immutable module fixture
        shell: bash
        run: |
          set -euo pipefail
          expected="$(python -c 'import json; print(json.load(open("ci/module-fixture.lock.json", encoding="utf-8"))["commit"])')"
          actual="$(git -C specfact-cli-modules rev-parse HEAD)"
          test "$actual" = "$expected"
      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - name: Set up frozen CLI validation dependencies
        uses: ./.github/actions/setup-frozen-python
      - name: Build and install CLI wheel
        shell: bash
        run: |
          set -euo pipefail
          echo "Building and installing SpecFact CLI wheel..."
          uv build --wheel
          python -m venv "$RUNNER_TEMP/specfact-cli-validation"
          "$RUNNER_TEMP/specfact-cli-validation/bin/python" -m pip install --require-hashes -r requirements/ci/locked.txt
          "$RUNNER_TEMP/specfact-cli-validation/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/specfact-cli-validation/bin/specfact" --help
          "$RUNNER_TEMP/specfact-cli-validation/bin/specfact-cli" --help
      - name: Validate CLI commands
        run: |
          echo "🔍 Validating CLI commands..."
          python scripts/generate-command-overview.py --check
          python scripts/check-command-contract.py
          python scripts/check-docs-commands.py
          echo "✅ CLI validation complete"

  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    needs: [changes, tests]
    if: needs.changes.outputs.skip_expensive_tests_dev_to_main != 'true' && needs.tests.outputs.run_unit_coverage == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
      - name: Download coverage artifacts from Tests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: coverage-reports
          path: logs/tests/coverage
      - name: Validate coverage artifact presence
        run: |
          test -f logs/tests/coverage/coverage.xml || (echo "❌ Missing coverage.xml" && exit 1)
          echo "✅ Found coverage.xml"
      - name: Run quality gates
        run: |
          set -o pipefail
          mkdir -p logs/quality-gates
          QG_LOG="logs/quality-gates/quality-gates_$(date -u +%Y%m%d_%H%M%S).log"
          {
            echo "🔍 Checking coverage threshold..."
            COVERAGE_FAIL_UNDER=$(python - <<'PY'
          import tomllib
          from pathlib import Path

          config = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          configured_fail_under = float(config["tool"]["coverage"]["report"]["fail_under"])
          print(configured_fail_under)
          PY
          )
            COVERAGE_PERCENT=$(python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = ET.parse(Path("logs/tests/coverage/coverage.xml")).getroot()
          print(float(root.attrib.get("line-rate", "0")) * 100)
          PY
          )
            echo "📊 Line coverage: ${COVERAGE_PERCENT}%"
            echo "📊 Required coverage: ${COVERAGE_FAIL_UNDER}%"
            if ! python - "$COVERAGE_PERCENT" "$COVERAGE_FAIL_UNDER" <<'PY'
          import sys

          coverage = float(sys.argv[1])
          fail_under = float(sys.argv[2])
          raise SystemExit(0 if coverage >= fail_under else 1)
          PY
            then
              echo "::error::Coverage ${COVERAGE_PERCENT}% is below fail_under=${COVERAGE_FAIL_UNDER}%."
              exit 1
            else
              echo "✅ Coverage threshold satisfied"
            fi
          } 2>&1 | tee "$QG_LOG"
      - name: Upload quality-gates logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: quality-gates-logs
          path: logs/quality-gates/
          if-no-files-found: ignore

  independent-static-analysis:
    name: Independent Static Analysis
    runs-on: ubuntu-latest
    needs: [changes, verify-module-signatures]
    if: needs.changes.outputs.code_changed == 'true' || needs.changes.outputs.workflow_changed == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Set up frozen static-analysis dependencies
        uses: ./.github/actions/setup-frozen-python

      - name: Run independent Semgrep and Bandit gates
        env:
          SEMGREP_ENABLE_VERSION_CHECK: "0"
        run: |
          mkdir -p logs/static-analysis
          semgrep scan --config tools/semgrep/sast.yml --json --output logs/static-analysis/semgrep.json
          python scripts/semgrep_sast_gate.py \
            --results logs/static-analysis/semgrep.json \
            --baseline tools/semgrep/sast-baseline.json
          bandit -r src/ -ll -f json -o logs/static-analysis/bandit.json

      - name: Upload independent static-analysis artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: independent-static-analysis
          path: logs/static-analysis/
          if-no-files-found: ignore

  package-runtime-matrix:
    name: Package Runtime Matrix
    runs-on: ubuntu-latest
    needs: [changes, verify-module-signatures]
    if: needs.changes.outputs.code_changed == 'true' || needs.changes.outputs.workflow_changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        launcher: [uv-source, pip-wheel, pipx, uv-run]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up frozen runtime dependencies
        uses: ./.github/actions/setup-frozen-python

      - name: Build package wheel
        run: |
          uv build --wheel
          find dist -maxdepth 1 -name '*.whl' -print -exec ls -lh {} \;

      - name: Validate runtime launcher
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "logs/package-runtime/${{ matrix.launcher }}"
          WHEEL="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          if [ -z "$WHEEL" ]; then
            echo "::error::No wheel found in dist/"
            exit 1
          fi
          VENV="$RUNNER_TEMP/specfact-runtime-${{ matrix.launcher }}"
          PIPX_HOME="$RUNNER_TEMP/pipx-home-${{ matrix.launcher }}"
          PIPX_BIN_DIR="$RUNNER_TEMP/pipx-bin-${{ matrix.launcher }}"
          PIPX_DEFAULT_BACKEND=pip
          export PIPX_HOME PIPX_BIN_DIR PIPX_DEFAULT_BACKEND

          python -m venv "$VENV"
          "$VENV/bin/python" -m pip install --require-hashes -r requirements/ci/locked.txt
          "$VENV/bin/python" -m pip install --no-deps "$WHEEL"

          run_specfact() {
            case "${{ matrix.launcher }}" in
              uv-source)
                uv run --locked --no-sync specfact "$@"
                ;;
              pip-wheel)
                "$VENV/bin/specfact" "$@"
                ;;
              pipx)
                "$PIPX_BIN_DIR/specfact" "$@"
                ;;
              uv-run)
                uv run --no-project --no-sync --python "$VENV/bin/python" "$VENV/bin/specfact" "$@"
                ;;
            esac
          }

          run_specfact_cli() {
            case "${{ matrix.launcher }}" in
              uv-source)
                uv run --locked --no-sync specfact-cli "$@"
                ;;
              pip-wheel)
                "$VENV/bin/specfact-cli" "$@"
                ;;
              pipx)
                "$PIPX_BIN_DIR/specfact-cli" "$@"
                ;;
              uv-run)
                uv run --no-project --no-sync --python "$VENV/bin/python" "$VENV/bin/specfact-cli" "$@"
                ;;
            esac
          }

          if [ "${{ matrix.launcher }}" = "pipx" ]; then
            PIPX_LOCK="$RUNNER_TEMP/pylock.specfact-deps.toml"
            uv export --locked --format pylock.toml --no-emit-project --output-file "$PIPX_LOCK" >/dev/null
            pipx install --python "$pythonLocation/bin/python" --lock "$PIPX_LOCK" "$WHEEL"
          fi

          run_specfact --help | tee "logs/package-runtime/${{ matrix.launcher }}/specfact-help.log"
          run_specfact_cli --help | tee "logs/package-runtime/${{ matrix.launcher }}/specfact-cli-help.log"
          run_specfact module list --show-origin | tee "logs/package-runtime/${{ matrix.launcher }}/module-list.log"
          run_specfact init ide --help | tee "logs/package-runtime/${{ matrix.launcher }}/init-ide-help.log"
          if run_specfact definitely-not-a-command >"logs/package-runtime/${{ matrix.launcher }}/unknown-command.log" 2>&1; then
            echo "::error::Unknown command unexpectedly succeeded"
            exit 1
          fi

      - name: Upload package-runtime matrix logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: package-runtime-${{ matrix.launcher }}-${{ matrix.python-version }}
          path: logs/package-runtime/
          if-no-files-found: ignore

