schema_version: '2'
requirements:
  openspec:dependency-update-consolidation:dependency-update-consolidation:caller-owned-jwt-verification-options:
    rationale: caller owned jwt verification options
    stakeholder_refs:
      - nold-ai/specfact-cli#747
      - nold-ai/specfact-cli#755
    touchpoints:
      - id: jwt-graph
        kind: config_file
        locator: uv.lock
    verification_cases:
      - case_id: DEP-SEC-001
        scenario_id: caller-owned-jwt-verification-options
        method: test
        intent: Caller options remain unchanged and expiry is enforced on reuse.
        observable: Caller options remain unchanged and expiry is enforced on reuse.
        selector:
          runner: pytest
          node_id: tests/unit/security/test_frozen_jwt_compatibility.py::test_inspection_preserves_options_and_expiry_on_reuse
      - case_id: DEP-SEC-002
        scenario_id: caller-owned-jwt-verification-options
        method: inspection
        intent: >-
          Inspect independently required test execution:
          tests/unit/security/test_frozen_jwt_compatibility.py::test_signed_token_and_trailing_signature_padding_remain_supported
        observable: >-
          Retain the exact current full-CI and focused-control results for
          tests/unit/security/test_frozen_jwt_compatibility.py::test_signed_token_and_trailing_signature_padding_remain_supported.
          This inspection is not native RED/final execution proof; unavailable or failing required tests block delivery.
