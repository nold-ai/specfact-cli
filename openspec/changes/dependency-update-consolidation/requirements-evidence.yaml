          This inspection is not native RED/final execution proof; unavailable or failing required tests block delivery.
      - case_id: DEP-FIX-003
        scenario_id: versioning-fixture-excludes-git-metadata
        method: inspection
        intent: >-
          Inspect independently required test execution:
          tests/unit/versioning/test_analyzer.py::TestChangeAnalyzer::test_detects_breaking_changes
        observable: >-
          Retain the exact current full-CI and focused-control results for
          tests/unit/versioning/test_analyzer.py::TestChangeAnalyzer::test_detects_breaking_changes.
          This inspection is not native RED/final execution proof; unavailable or failing required tests block delivery.
  openspec:dependency-update-consolidation:dependency-update-consolidation:coherent-reviewed-frozen-repair:
    rationale: coherent reviewed frozen repair
    stakeholder_refs:
      - nold-ai/specfact-cli#747
      - nold-ai/specfact-cli#755
    touchpoints:
      - id: frozen-lock
        kind: config_file
        locator: uv.lock
      - id: frozen-export
        kind: config_file
        locator: requirements/ci/locked.txt
      - id: isolated-smoke-seed
        kind: code_symbol
        locator: scripts/runtime_discovery_smoke.py::_create_pip_editable_launcher
    verification_cases:
      - case_id: DEP-GRAPH-001
        scenario_id: coherent-reviewed-frozen-repair
        method: inspection
        intent: Review graph/export, exact artifacts and independent current gate results.
        observable: >-
          Only required reviewed updates are present; both audits, trust/licenses, consumers and Python matrix retain
          independent results. Unavailable results never imply passing.
      - case_id: DEP-CACHE-001
        scenario_id: coherent-reviewed-frozen-repair
        method: test
        intent: Fallback creation must isolate seed app data and disable background periodic updates.
        observable: >-
          Captured virtualenv arguments use the temporary workspace cache and disable periodic updates; editable
          launcher construction remains intact.
        selector:
          runner: pytest
          node_id: tests/integration/scripts/test_runtime_discovery_smoke.py::test_pip_editable_fallback_isolates_seed_app_data
