schema_version: '2'
requirements:
  openspec:dependency-update-consolidation:dependency-update-consolidation:caller-owned-jwt-verification-options:
    rationale: caller owned jwt verification options
    stakeholder_refs:
    - nold-ai/specfact-cli#747
    - nold-ai/specfact-cli#755
    touchpoints:
    - id: jwt-graph
      kind: config_file
      locator: uv.lock
    verification_cases:
    - case_id: DEP-SEC-001
      scenario_id: caller-owned-jwt-verification-options
      method: test
      intent: Caller options remain unchanged and expiry is enforced on reuse.
      observable: Caller options remain unchanged and expiry is enforced on reuse.
      selector:
        runner: pytest
        node_id: tests/unit/security/test_frozen_jwt_compatibility.py::test_inspection_preserves_options_and_expiry_on_reuse
    - case_id: DEP-SEC-002
      scenario_id: caller-owned-jwt-verification-options
      method: test
      intent: Normal signed token and trailing signature padding remain supported.
      observable: Normal signed token and trailing signature padding remain supported.
      selector:
        runner: pytest
        node_id: tests/unit/security/test_frozen_jwt_compatibility.py::test_signed_token_and_trailing_signature_padding_remain_supported
  openspec:dependency-update-consolidation:dependency-update-consolidation:versioning-fixture-excludes-git-metadata:
    rationale: versioning fixture excludes git metadata
    stakeholder_refs:
    - nold-ai/specfact-cli#747
    - nold-ai/specfact-cli#755
    touchpoints:
    - id: fixture-staging
      kind: config_file
      locator: tests/unit/versioning/test_analyzer.py
    verification_cases:
    - case_id: DEP-FIX-001
      scenario_id: versioning-fixture-excludes-git-metadata
      method: test
      intent: patch classification assertions pass.
      observable: patch classification assertions pass.
      selector:
        runner: pytest
        node_id: tests/unit/versioning/test_analyzer.py::TestChangeAnalyzer::test_detects_patch_changes
    - case_id: DEP-FIX-002
      scenario_id: versioning-fixture-excludes-git-metadata
      method: test
      intent: additive classification assertions pass.
      observable: additive classification assertions pass.
      selector:
        runner: pytest
        node_id: tests/unit/versioning/test_analyzer.py::TestChangeAnalyzer::test_detects_additive_changes
    - case_id: DEP-FIX-003
      scenario_id: versioning-fixture-excludes-git-metadata
      method: test
      intent: breaking classification assertions pass.
      observable: breaking classification assertions pass.
      selector:
        runner: pytest
        node_id: tests/unit/versioning/test_analyzer.py::TestChangeAnalyzer::test_detects_breaking_changes
  openspec:dependency-update-consolidation:dependency-update-consolidation:coherent-reviewed-frozen-repair:
    rationale: coherent reviewed frozen repair
    stakeholder_refs:
    - nold-ai/specfact-cli#747
    - nold-ai/specfact-cli#755
    touchpoints:
    - id: frozen-lock
      kind: config_file
      locator: uv.lock
    - id: frozen-export
      kind: config_file
      locator: requirements/ci/locked.txt
    verification_cases:
    - case_id: DEP-GRAPH-001
      scenario_id: coherent-reviewed-frozen-repair
      method: inspection
      intent: Review graph/export, exact artifacts and independent current gate results.
      observable: Only required reviewed updates are present; both audits, trust/licenses, consumers and
        Python matrix retain independent results. Unavailable results never imply passing.
