schema_version: "2"
requirements:
  openspec:fix-release-promotion-security-gates:trustworthy-green-checks:privileged-companion-module-execution-does-not-persist-dependency-caches:
    rationale: "Privileged jobs must not restore or save dependency-cache content writable by companion-module code."
    stakeholder_refs:
      - "nold-ai/specfact-cli#692"
      - "nold-ai/specfact-cli#691"
    touchpoints:
      - id: frozen-python-action
        kind: ci_workflow
        locator: ".github/actions/setup-frozen-python/action.yml"
      - id: dependency-compatibility-workflow
        kind: ci_workflow
        locator: ".github/workflows/pr-orchestrator.yml"
      - id: cache-boundary-regression
        kind: test_file
        locator: "tests/unit/specfact_cli/registry/test_signing_artifacts.py"
      - id: workflow-boundary-regression
        kind: test_file
        locator: "tests/unit/workflows/test_trustworthy_green_checks.py"
    verification_cases:
      - case_id: RELEASE-692-CACHE-S01
        scenario_id: privileged-companion-module-execution-does-not-persist-dependency-caches
        method: test
        intent: "Prove the shared frozen action disables persistent setup-uv cache restore and save."
        observable: "The action declares enable-cache false, retains locked synchronization, and contains no true override."
        selector:
          runner: pytest
          node_id: tests/unit/specfact_cli/registry/test_signing_artifacts.py::test_frozen_setup_action_disables_persistent_cache_before_external_fixture_execution
      - case_id: RELEASE-692-FIXTURE-S03
        scenario_id: privileged-companion-module-execution-does-not-persist-dependency-caches
        method: test
        intent: "Prove the compatibility fixture has no branch-selected manual entrypoint and is verified before export."
        observable: "The PR Orchestrator has no manual trigger; its schedule-only job verifies commit and tree before module path export."
        selector:
          runner: pytest
          node_id: tests/unit/workflows/test_trustworthy_green_checks.py::test_manual_dependency_compatibility_rejects_unprotected_fixture_refs
      - case_id: RELEASE-692-CACHE-S04
        scenario_id: privileged-companion-module-execution-does-not-persist-dependency-caches
        method: test
        intent: "Prove Requirements module execution is not followed by a persistent npm cache hook."
        observable: "The later setup-node step pins Node without cache or cache-dependency inputs."
        selector:
          runner: pytest
          node_id: tests/unit/workflows/test_requirements_evidence_delivery_workflow.py::test_requirements_evidence_code_review_setup_does_not_persist_an_npm_cache
  openspec:fix-release-promotion-security-gates:trustworthy-green-checks:dependency-review-exceptions-remain-bound-to-their-declared-environment:
    rationale: "The isolated Pylint review exception must not weaken other installed-environment scans."
    stakeholder_refs:
      - "nold-ai/specfact-cli#692"
      - "nold-ai/specfact-cli#691"
    touchpoints:
      - id: license-gate
        kind: source_file
        locator: "scripts/check_license_compliance.py"
      - id: license-policy
        kind: config
        locator: "scripts/license_allowlist.yaml"
      - id: license-regressions
        kind: test_file
        locator: "tests/unit/scripts/test_check_license_compliance.py"
    verification_cases:
      - case_id: RELEASE-692-LICENSE-S01
        scenario_id: dependency-review-exceptions-remain-bound-to-their-declared-environment
        method: test
        intent: "Prove the primary environment rejects the Code Review-only Pylint exception."
        observable: "Exact Pylint 4.0.7 GPL metadata produces a violation under the default environment role."
        selector:
          runner: pytest
          node_id: tests/unit/scripts/test_check_license_compliance.py::TestAllowlistAccepted::test_code_review_only_exception_is_rejected_by_primary_environment
      - case_id: RELEASE-692-LICENSE-S02
        scenario_id: dependency-review-exceptions-remain-bound-to-their-declared-environment
        method: test
        intent: "Prove only the dedicated frozen Code Review role accepts the exact reviewed metadata."
        observable: "The exact Pylint release passes only with code-review-only scope."
        selector:
          runner: pytest
          node_id: tests/unit/scripts/test_check_license_compliance.py::TestAllowlistAccepted::test_code_review_only_exception_is_accepted_only_for_review_environment
  openspec:fix-release-promotion-security-gates:trustworthy-green-checks:local-dependency-trust-reacts-to-every-frozen-review-input:
    rationale: "Local trust and CVE gates must select the same frozen Code Review inputs."
    stakeholder_refs:
      - "nold-ai/specfact-cli#692"
    touchpoints:
      - id: pre-commit-trust-filter
        kind: config
        locator: ".pre-commit-config.yaml"
      - id: trust-filter-regression
        kind: test_file
        locator: "tests/unit/workflows/test_trustworthy_green_checks.py"
    verification_cases:
      - case_id: RELEASE-692-TRUST-S01
        scenario_id: local-dependency-trust-reacts-to-every-frozen-review-input
        method: test
        intent: "Prove both Code Review input and lock select dependency trust locally."
        observable: "The dependency-trust pre-commit regex contains the exact Code Review input pair."
        selector:
          runner: pytest
          node_id: tests/unit/workflows/test_trustworthy_green_checks.py::test_dependency_trust_is_a_standalone_ci_and_pre_commit_gate
  openspec:fix-release-promotion-security-gates:trustworthy-green-checks:active-openspec-authoring-is-not-mistaken-for-archival-deletion:
    rationale: "The archive guard must permit ordinary authoring while retaining exact archive enforcement."
    stakeholder_refs:
      - "nold-ai/specfact-cli#692"
      - "nold-ai/specfact-cli#691"
    touchpoints:
      - id: active-change-guard
        kind: source_file
        locator: "scripts/pre-commit-quality-checks.sh"
      - id: active-change-regression
        kind: test_file
        locator: "tests/unit/scripts/test_requirements_evidence_pre_commit.py"
    verification_cases:
      - case_id: RELEASE-692-ARCHIVE-S01
        scenario_id: active-openspec-authoring-is-not-mistaken-for-archival-deletion
        method: test
        intent: "Prove an ordinary deletion passes while complete deletion remains rejected."
        observable: "The combined regression admits one-file deletion and retains archive negative controls."
        selector:
          runner: pytest
          node_id: tests/unit/scripts/test_requirements_evidence_pre_commit.py::test_pre_commit_selects_deleted_active_change_unless_fully_archived
  openspec:fix-release-promotion-security-gates:trustworthy-green-checks:stateful-staged-index-hooks-execute-once-per-commit:
    rationale: "A staged-index auto-fixer must not race concurrent Git index updates across filename batches."
    stakeholder_refs:
      - "nold-ai/specfact-cli#692"
    touchpoints:
      - id: pre-commit-markdown-fix
        kind: config
        locator: ".pre-commit-config.yaml"
      - id: pre-commit-hook-regression
        kind: test_file
        locator: "tests/unit/workflows/test_trustworthy_green_checks.py"
    verification_cases:
      - case_id: RELEASE-692-PRECOMMIT-S01
        scenario_id: stateful-staged-index-hooks-execute-once-per-commit
        method: test
        intent: "Prove pre-commit launches the staged-index Markdown fixer only once."
        observable: "The Markdown auto-fix hook disables pre-commit filename batching while retaining its staged-file filter."
        selector:
          runner: pytest
          node_id: tests/unit/workflows/test_trustworthy_green_checks.py::test_pre_commit_config_matches_modular_quality_layout
  openspec:fix-release-promotion-security-gates:trustworthy-green-checks:frozen-static-analysis-uses-a-non-vulnerable-mcp-binding:
    rationale: "A compatible Semgrep release removes the need for the vulnerable MCP waiver."
    stakeholder_refs:
      - "nold-ai/specfact-cli#692"
    touchpoints:
      - id: dependency-policy
        kind: config
        locator: "pyproject.toml"
      - id: frozen-resolution
        kind: lockfile
        locator: "uv.lock"
      - id: frozen-export
        kind: lockfile
        locator: "requirements/ci/locked.txt"
      - id: audit-exceptions
        kind: config
        locator: "ci/vulnerability-audit-exceptions.json"
      - id: dependency-regression
        kind: test_file
        locator: "tests/unit/scripts/test_reproducible_delivery.py"
    verification_cases:
      - case_id: RELEASE-692-MCP-S01
        scenario_id: frozen-static-analysis-uses-a-non-vulnerable-mcp-binding
        method: test
        intent: "Prove every Semgrep surface selects a release bound to fixed MCP and no stale waiver remains."
        observable: >-
          Semgrep floors are at least 1.175.0, frozen inputs contain Semgrep
          1.175.0 and MCP 1.29.0, MCP stays out of core runtime, and the audit
          exception register has no MCP entry.
        selector:
          runner: pytest
          node_id: tests/unit/scripts/test_reproducible_delivery.py::test_reproducible_delivery_pins_semgrep_with_fixed_mcp_without_waiver
  openspec:fix-release-promotion-security-gates:trustworthy-green-checks:retained-proof-binds-only-active-pytest-plugin-declarations:
    rationale: "Inactive local assignments must not create false stale-proof dependencies."
    stakeholder_refs:
      - "nold-ai/specfact-cli#692"
      - "nold-ai/specfact-cli#691"
    touchpoints:
      - id: proof-provenance
        kind: source_file
        locator: "scripts/requirements_proof_provenance.py"
      - id: plugin-discovery-regression
        kind: test_file
        locator: "tests/unit/scripts/test_requirements_proof_provenance.py"
      - id: plugin-discovery-review-regression
        kind: test_file
        locator: "tests/unit/scripts/test_requirements_proof_provenance_review_regressions_v2.py"
    verification_cases:
      - case_id: RELEASE-692-PYTEST-S01
        scenario_id: retained-proof-binds-only-active-pytest-plugin-declarations
        method: test
        intent: "Prove active module plugin declarations are bound or fail closed while local assignments are ignored."
        observable: >-
          Literal direct, conditional, and annotated declarations are returned;
          computed and indirect import-time bindings are rejected; nested bodies
          and comprehension iteration targets are ignored.
        selector:
          runner: pytest
          node_id: tests/unit/scripts/test_requirements_proof_provenance.py::test_pytest_plugin_discovery_ignores_function_local_assignments
      - case_id: RELEASE-692-PYTEST-S02
        scenario_id: retained-proof-binds-only-active-pytest-plugin-declarations
        method: test
        intent: "Prove direct and chained aliases of the imported builtins owner retain dynamic-execution authority."
        observable: "Every alias path to builtins.exec or builtins.eval invalidates retained proof."
        selector:
          runner: pytest
          node_id: tests/unit/scripts/test_requirements_proof_provenance.py::test_pytest_plugin_discovery_rejects_builtins_module_aliases
      - case_id: RELEASE-692-PYTEST-S03
        scenario_id: retained-proof-binds-only-active-pytest-plugin-declarations
        method: test
        intent: "Prove mapping captures inherit their statically corresponding namespace subject value."
        observable: "Direct, reordered, and nested mapping captures of globals fail closed while ordinary mapping values remain compatible."
        selector:
          runner: pytest
          node_id: tests/unit/scripts/test_requirements_proof_provenance.py::test_pytest_plugin_discovery_rejects_mapping_pattern_namespace_captures
      - case_id: RELEASE-692-PYTEST-S04
        scenario_id: retained-proof-binds-only-active-pytest-plugin-declarations
        method: test
        intent: "Prove a definite ordinary reassignment ends prior alias authority without weakening uncertain paths."
        observable: "Ordinary replacements pass; use-before-shadow, re-alias, and conditional replacement fail closed."
        selector:
          runner: pytest
          node_id: tests/unit/scripts/test_requirements_proof_provenance.py::test_pytest_plugin_discovery_allows_legitimate_namespace_access
      - case_id: RELEASE-692-PYTEST-S05
        scenario_id: retained-proof-binds-only-active-pytest-plugin-declarations
        method: test
        intent: "Prove computed or opaque owners cannot hide import-time dynamic-execution authority."
        observable: >-
          Tuple, nested mapping, helper, lambda, computed-attribute, and
          class-body paths to exec or eval all invalidate retained proof.
        selector:
          runner: pytest
          node_id: tests/unit/scripts/test_requirements_proof_provenance.py::test_pytest_plugin_discovery_rejects_computed_builtins_owner_expressions
      - case_id: RELEASE-692-PYTEST-S06
        scenario_id: retained-proof-binds-only-active-pytest-plugin-declarations
        method: test
        intent: "Prove assigning an unresolved computed owner cannot turn dynamic-execution authority into a definite safe shadow."
        observable: >-
          Container, helper-returned, conditional, and class-body owner
          assignments that reach exec or eval all invalidate retained proof.
        selector:
          runner: pytest
          node_id: tests/unit/scripts/test_requirements_proof_provenance.py::test_pytest_plugin_discovery_rejects_assigned_computed_owner_expressions
      - case_id: RELEASE-692-PYTEST-S11
        scenario_id: retained-proof-binds-only-active-pytest-plugin-declarations
        method: test
        intent: "Prove object-level setters cannot hide a current-module pytest plugin binding."
        observable: >-
          Direct, computed, bound, and dynamic-name object.__setattr__ forms on
          the current module fail closed while ordinary object mutations and
          unrelated module attributes remain compatible.
        selector:
          runner: pytest
          node_id: tests/unit/scripts/test_requirements_proof_provenance_review_regressions_v2.py::test_object_setattr_current_module_binding_fails_closed
      - case_id: RELEASE-692-PYTEST-S13
        scenario_id: retained-proof-binds-only-active-pytest-plugin-declarations
        method: test
        intent: "Prove a custom current-module type cannot synthesize a hidden pytest plugin binding."
        observable: >-
          Assigning a custom ModuleType subclass to the executing module's
          __class__ fails closed, while an unrelated object's class assignment
          remains compatible.
        selector:
          runner: pytest
          node_id: tests/unit/scripts/test_requirements_proof_provenance_review_regressions_v2.py::test_custom_current_module_type_fails_closed
      - case_id: RELEASE-692-PYTEST-S14
        scenario_id: retained-proof-binds-only-active-pytest-plugin-declarations
        method: test
        intent: "Prove module-registry replacement cannot substitute hidden pytest plugin declarations."
        observable: >-
          Import-time sys.modules mutations fail closed, while read-only access to
          the active module registry remains compatible.
        selector:
          runner: pytest
          node_id: tests/unit/scripts/test_requirements_proof_provenance_review_regressions_v2.py::test_current_module_registry_replacement_fails_closed
      - case_id: RELEASE-692-PYTEST-S15
        scenario_id: retained-proof-binds-only-active-pytest-plugin-declarations
        method: test
        intent: "Prove builtin attribute lookup cannot synthesize a hidden pytest plugin binding."
        observable: >-
          Mutating builtins.getattr through an attribute or mapping view fails
          closed, while an unrelated builtins attribute assignment remains compatible.
        selector:
          runner: pytest
          node_id: tests/unit/scripts/test_requirements_proof_provenance_review_regressions_v2.py::test_builtins_getattr_mutation_fails_closed
      - case_id: RELEASE-692-PYTEST-S16
        scenario_id: retained-proof-binds-only-active-pytest-plugin-declarations
        method: test
        intent: "Prove imperative pytest plugin-manager imports remain frozen proof inputs."
        observable: >-
          A literal config.pluginmanager.import_plugin target is retained as a
          repository dependency, while an unresolved target fails closed.
        selector:
          runner: pytest
          node_id: tests/unit/scripts/test_requirements_proof_provenance_review_regressions_v2.py::test_pytest_configure_import_plugin_is_retained_or_rejected
      - case_id: RELEASE-692-PYTEST-S17
        scenario_id: retained-proof-binds-only-active-pytest-plugin-declarations
        method: test
        intent: "Prove eagerly invoked higher-order callables cannot hide active pytest plugin writes."
        observable: >-
          Passing active-module authority to a higher-order setter or callable
          factory fails closed, while an unrelated-object wrapper remains compatible.
        selector:
          runner: pytest
          node_id: tests/unit/scripts/test_requirements_proof_provenance_review_regressions_v2.py::test_higher_order_plugin_namespace_mutator_fails_closed
      - case_id: RELEASE-692-PYTEST-S18
        scenario_id: retained-proof-binds-only-active-pytest-plugin-declarations
        method: test
        intent: "Prove higher-order callables cannot escape frozen import-loader authority."
        observable: >-
          A higher-order callable using a literal loader target retains the
          repository module, while a dynamic wrapped target fails closed.
        selector:
          runner: pytest
          node_id: tests/unit/scripts/test_requirements_proof_provenance_review_regressions_v2.py::test_higher_order_import_factory_is_retained_or_rejected
  openspec:fix-release-promotion-security-gates:trustworthy-green-checks:retained-proof-binds-the-complete-executable-pytest-harness:
    rationale: "Retained red evidence must bind every repository-controlled input that can alter selected pytest execution."
    stakeholder_refs:
      - "nold-ai/specfact-cli#692"
      - "nold-ai/specfact-cli#698"
    touchpoints:
      - id: proof-executor
        kind: source_file
        locator: "scripts/requirements_proof_executor.py"
      - id: proof-provenance
        kind: source_file
        locator: "scripts/requirements_proof_provenance.py"
      - id: frozen-resolution
        kind: lockfile
        locator: "uv.lock"
      - id: executor-regression
        kind: test_file
        locator: "tests/unit/scripts/test_requirements_proof_executor.py"
      - id: provenance-regression
        kind: test_file
        locator: "tests/unit/scripts/test_requirements_proof_provenance_review_regressions.py"
      - id: provenance-review-regression-v2
        kind: test_file
        locator: "tests/unit/scripts/test_requirements_proof_provenance_review_regressions_v2.py"
    verification_cases:
      - case_id: RELEASE-692-PYTEST-S07
        scenario_id: retained-proof-binds-the-complete-executable-pytest-harness
        method: test
        intent: "Prove repository-root shadow files cannot replace the installed pytest package."
        observable: "The executor resolves installed pytest under safe-path startup before adding the repository root for the bound plugin."
        selector:
          runner: pytest
          node_id: tests/unit/scripts/test_requirements_proof_executor.py::test_executor_uses_safe_path_before_resolving_installed_pytest
      - case_id: RELEASE-692-PYTEST-S08
        scenario_id: retained-proof-binds-the-complete-executable-pytest-harness
        method: test
        intent: "Prove unresolved current-module plugin writes cannot evade retained-input discovery."
        observable: "Current-module import and attribute-write forms fail closed while a proven ordinary namespace remains compatible."
        selector:
          runner: pytest
          node_id: tests/unit/scripts/test_requirements_proof_provenance_review_regressions.py::test_review_bypasses_fail_closed
      - case_id: RELEASE-692-PYTEST-S09
        scenario_id: retained-proof-binds-the-complete-executable-pytest-harness
        method: test
        intent: "Prove literal dynamic repository imports are retained and unresolved loader arguments fail closed."
        observable: >-
          Importlib, builtin loader, aliased-loader, callable-wrapper, and
          namespace-mapping forms resolve repository modules; opaque loader,
          selector, key, or target expressions are rejected.
        selector:
          runner: pytest
          node_id: tests/unit/scripts/test_requirements_proof_provenance_review_regressions.py::test_dynamic_repository_imports_are_retained_or_fail_closed
      - case_id: RELEASE-692-PYTEST-S10
        scenario_id: retained-proof-binds-the-complete-executable-pytest-harness
        method: test
        intent: "Prove fixed producers, the frozen graph, and implicit selected-package initializers remain freshness-bound."
        observable: "Changing any fixed producer, uv.lock, or the selected package initializer after red makes the proof stale."
        selector:
          runner: pytest
          node_id: tests/unit/scripts/test_requirements_proof_provenance_review_regressions.py::test_core_proof_inputs_and_selected_package_initializers_are_retained
      - case_id: RELEASE-692-PYTEST-S12
        scenario_id: retained-proof-binds-the-complete-executable-pytest-harness
        method: test
        intent: "Prove builtins-qualified and callable-wrapped import factories cannot hide repository proof inputs."
        observable: >-
          Direct, getattr, alias, __call__, mapping, and mapping-method forms
          retain a literal repository helper; computed factory or target names
          fail closed.
        selector:
          runner: pytest
          node_id: tests/unit/scripts/test_requirements_proof_provenance_review_regressions_v2.py::test_builtins_dynamic_import_forms_are_retained_or_rejected
  openspec:fix-release-promotion-security-gates:trustworthy-green-checks:requirements-proof-supports-verified-pull-request-amendment-cycles:
    rationale: "Late review fixes need another authenticated red-to-green cycle on the same pull request."
    stakeholder_refs:
      - "nold-ai/specfact-cli#692"
      - "nold-ai/specfact-cli#698"
    touchpoints:
      - id: requirements-workflow
        kind: workflow
        locator: ".github/workflows/requirements-evidence.yml"
      - id: cycle-authority
        kind: source_file
        locator: "scripts/requirements_cycle_base.py"
      - id: proof-provenance
        kind: source_file
        locator: "scripts/requirements_proof_provenance.py"
      - id: cycle-authority-regression
        kind: test_file
        locator: "tests/unit/scripts/test_requirements_cycle_base.py"
      - id: workflow-regression
        kind: test_file
        locator: "tests/unit/workflows/test_requirements_evidence_delivery_workflow.py"
      - id: amendment-workflow-regression
        kind: test_file
        locator: "tests/unit/workflows/test_requirements_evidence_amendment_review_regressions.py"
      - id: cycle-revalidation-regression
        kind: test_file
        locator: "tests/unit/scripts/test_requirements_proof_provenance_review_regressions.py"
      - id: cycle-authority-regression-v2
        kind: test_file
        locator: "tests/unit/scripts/test_requirements_cycle_base_v2.py"
      - id: amendment-bootstrap-regression-v2
        kind: test_file
        locator: "tests/unit/scripts/test_requirements_amendment_bootstrap_v2.py"
    verification_cases:
      - case_id: RELEASE-692-CYCLE-S01
        scenario_id: requirements-proof-supports-verified-pull-request-amendment-cycles
        method: test
        intent: "Prove only the same PR's successful verified ancestor can narrow the amendment-cycle boundary."
        observable: >-
          Matching run, artifact, branch, PR, repository, final source, and
          ancestry pass; failed, foreign, tampered, or non-ancestor candidates
          are rejected.
        selector:
          runner: pytest
          node_id: tests/unit/scripts/test_requirements_cycle_base.py::test_cycle_base_accepts_only_matching_verified_pull_request_history
      - case_id: RELEASE-692-CYCLE-S02
        scenario_id: requirements-proof-supports-verified-pull-request-amendment-cycles
        method: test
        intent: "Prove maturity and red provenance use the verified cycle delta while the full OpenSpec plan keeps the PR base."
        observable: >-
          The workflow discovers a verified cycle base, uses it for maturity and
          red binding, and retains origin/dev for complete change planning.
        selector:
          runner: pytest
          node_id: tests/unit/workflows/test_requirements_evidence_delivery_workflow.py::test_requirements_evidence_workflow_supports_verified_amendment_cycles
      - case_id: RELEASE-692-CYCLE-S03
        scenario_id: requirements-proof-supports-verified-pull-request-amendment-cycles
        method: test
        intent: "Prove external authority bypasses only the matching green producer self-authorship predicate."
        observable: "An exact artifact-bound authority digest admits the verified green; absence or mismatch rejects it."
        selector:
          runner: pytest
          node_id: tests/unit/scripts/test_requirements_cycle_base.py::test_cycle_base_accepts_self_authored_green_only_with_matching_external_authority_digest
      - case_id: RELEASE-692-CYCLE-S04
        scenario_id: requirements-proof-supports-verified-pull-request-amendment-cycles
        method: test
        intent: "Prove the external bootstrap does not preempt a later ordinary amendment cycle."
        observable: >-
          The workflow live-revalidates external authority, tries current
          verified green and failed-red history, and uses the fixed external
          pair only as fallback.
        selector:
          runner: pytest
          node_id: tests/unit/workflows/test_requirements_evidence_amendment_review_regressions.py::test_exact_external_amendment_bootstraps_later_generic_cycle_selection
      - case_id: RELEASE-692-CYCLE-S05
        scenario_id: requirements-proof-supports-verified-pull-request-amendment-cycles
        method: test
        intent: "Prove ordinary cycle proof reuse revalidates the exact externally authorized green artifact."
        observable: >-
          The derived authority receipt retains the external digest and
          provenance forwards it into live cycle-base validation.
        selector:
          runner: pytest
