schema_version: "2"
requirements:
  openspec:fix-release-promotion-security-gates:trustworthy-green-checks:privileged-companion-module-execution-does-not-persist-dependency-caches:
    rationale: "Privileged jobs must not restore or save dependency-cache content writable by companion-module code."
    stakeholder_refs:
      - "nold-ai/specfact-cli#692"
      - "nold-ai/specfact-cli#691"
    touchpoints:
      - id: frozen-python-action
        kind: ci_workflow
        locator: ".github/actions/setup-frozen-python/action.yml"
      - id: dependency-compatibility-workflow
        kind: ci_workflow
        locator: ".github/workflows/pr-orchestrator.yml"
      - id: cache-boundary-regression
        kind: test_file
        locator: "tests/unit/specfact_cli/registry/test_signing_artifacts.py"
      - id: workflow-boundary-regression
        kind: test_file
        locator: "tests/unit/workflows/test_trustworthy_green_checks.py"
    verification_cases:
      - case_id: RELEASE-692-CACHE-S01
        scenario_id: privileged-companion-module-execution-does-not-persist-dependency-caches
        method: test
        intent: "Prove the shared frozen action disables persistent setup-uv cache restore and save."
        observable: "The action declares enable-cache false, retains locked synchronization, and contains no true override."
        selector:
          runner: pytest
          node_id: tests/unit/specfact_cli/registry/test_signing_artifacts.py::test_frozen_setup_action_disables_persistent_cache_before_external_fixture_execution
      - case_id: RELEASE-692-FIXTURE-S03
        scenario_id: privileged-companion-module-execution-does-not-persist-dependency-caches
        method: test
        intent: "Prove the compatibility fixture has no branch-selected manual entrypoint and is verified before export."
        observable: "The PR Orchestrator has no manual trigger; its schedule-only job verifies commit and tree before module path export."
        selector:
          runner: pytest
          node_id: tests/unit/workflows/test_trustworthy_green_checks.py::test_manual_dependency_compatibility_rejects_unprotected_fixture_refs
      - case_id: RELEASE-692-CACHE-S04
        scenario_id: privileged-companion-module-execution-does-not-persist-dependency-caches
        method: test
        intent: "Prove Requirements module execution is not followed by a persistent npm cache hook."
        observable: "The later setup-node step pins Node without cache or cache-dependency inputs."
        selector:
          runner: pytest
          node_id: tests/unit/workflows/test_requirements_evidence_delivery_workflow.py::test_requirements_evidence_code_review_setup_does_not_persist_an_npm_cache
  openspec:fix-release-promotion-security-gates:trustworthy-green-checks:dependency-review-exceptions-remain-bound-to-their-declared-environment:
    rationale: "The isolated Pylint review exception must not weaken other installed-environment scans."
    stakeholder_refs:
      - "nold-ai/specfact-cli#692"
      - "nold-ai/specfact-cli#691"
    touchpoints:
      - id: license-gate
        kind: source_file
        locator: "scripts/check_license_compliance.py"
      - id: license-policy
        kind: config
        locator: "scripts/license_allowlist.yaml"
      - id: license-scope-policy
        kind: source_file
        locator: "scripts/license_scope_policy.py"
      - id: license-regressions
        kind: test_file
        locator: "tests/unit/scripts/test_check_license_compliance.py"
      - id: license-workflow-regressions
        kind: test_file
        locator: "tests/unit/workflows/test_trustworthy_green_checks.py"
    verification_cases:
      - case_id: RELEASE-692-LICENSE-S01
        scenario_id: dependency-review-exceptions-remain-bound-to-their-declared-environment
        method: test
        intent: "Prove the primary environment cannot select the Code Review-only Pylint exception."
        observable: "The exact Pylint exception remains code-review-only while the primary scan defaults to dev-only."
        selector:
          runner: pytest
          node_id: tests/unit/scripts/test_reproducible_delivery.py::test_primary_license_scope_excludes_the_code_review_exception
      - case_id: RELEASE-692-LICENSE-S02
        scenario_id: dependency-review-exceptions-remain-bound-to-their-declared-environment
        method: test
        intent: "Prove only the dedicated frozen Code Review path selects the exact reviewed metadata."
        observable: "Exactly one scan path selects code-review-only scope for Pylint 4.0.7 with the reviewed GPL metadata."
        selector:
          runner: pytest
          node_id: tests/unit/scripts/test_reproducible_delivery.py::test_code_review_license_scope_is_exactly_version_and_environment_bound
      - case_id: RELEASE-692-LICENSE-S03
        scenario_id: dependency-review-exceptions-remain-bound-to-their-declared-environment
        method: test
        intent: "Prove every frozen dependency-policy input selects the blocking license gate."
        observable: "Changes to the lock, allowlist, scanner, or shared scope policy all trigger the exact blocking workflow job."
        selector:
          runner: pytest
          node_id: tests/unit/workflows/test_trustworthy_green_checks.py::test_license_gate_runs_for_every_frozen_dependency_graph_change
  openspec:fix-release-promotion-security-gates:trustworthy-green-checks:local-dependency-trust-reacts-to-every-frozen-review-input:
    rationale: "Local trust and CVE gates must select the same frozen Code Review inputs."
    stakeholder_refs:
      - "nold-ai/specfact-cli#692"
    touchpoints:
      - id: pre-commit-trust-filter
        kind: config
        locator: ".pre-commit-config.yaml"
      - id: trust-filter-regression
        kind: test_file
        locator: "tests/unit/workflows/test_trustworthy_green_checks.py"
    verification_cases:
      - case_id: RELEASE-692-TRUST-S01
        scenario_id: local-dependency-trust-reacts-to-every-frozen-review-input
        method: test
        intent: "Prove both Code Review input and lock select dependency trust locally."
        observable: "The dependency-trust pre-commit regex contains the exact Code Review input pair."
        selector:
          runner: pytest
          node_id: tests/unit/workflows/test_trustworthy_green_checks.py::test_dependency_trust_is_a_standalone_ci_and_pre_commit_gate
  openspec:fix-release-promotion-security-gates:trustworthy-green-checks:active-openspec-authoring-is-not-mistaken-for-archival-deletion:
    rationale: "The archive guard must permit ordinary authoring while retaining exact archive enforcement."
    stakeholder_refs:
      - "nold-ai/specfact-cli#692"
      - "nold-ai/specfact-cli#691"
    touchpoints:
      - id: active-change-guard
        kind: source_file
        locator: "scripts/pre-commit-quality-checks.sh"
      - id: active-change-regression
        kind: test_file
        locator: "tests/unit/scripts/test_requirements_evidence_pre_commit.py"
    verification_cases:
      - case_id: RELEASE-692-ARCHIVE-S01
        scenario_id: active-openspec-authoring-is-not-mistaken-for-archival-deletion
        method: test
        intent: "Prove an ordinary deletion passes while complete deletion remains rejected."
        observable: "The combined regression admits one-file deletion and retains archive negative controls."
        selector:
          runner: pytest
          node_id: tests/unit/scripts/test_requirements_evidence_pre_commit.py::test_pre_commit_selects_deleted_active_change_unless_fully_archived
  openspec:fix-release-promotion-security-gates:trustworthy-green-checks:stateful-staged-index-hooks-execute-once-per-commit:
    rationale: "A staged-index auto-fixer must not race concurrent Git index updates across filename batches."
    stakeholder_refs:
      - "nold-ai/specfact-cli#692"
    touchpoints:
      - id: pre-commit-markdown-fix
        kind: config
        locator: ".pre-commit-config.yaml"
      - id: pre-commit-hook-regression
        kind: test_file
        locator: "tests/unit/workflows/test_trustworthy_green_checks.py"
    verification_cases:
      - case_id: RELEASE-692-PRECOMMIT-S01
        scenario_id: stateful-staged-index-hooks-execute-once-per-commit
        method: test
        intent: "Prove pre-commit launches the staged-index Markdown fixer only once."
        observable: "The Markdown auto-fix hook disables pre-commit filename batching while retaining its staged-file filter."
        selector:
          runner: pytest
          node_id: tests/unit/workflows/test_trustworthy_green_checks.py::test_pre_commit_config_matches_modular_quality_layout
  openspec:fix-release-promotion-security-gates:trustworthy-green-checks:frozen-static-analysis-uses-a-non-vulnerable-mcp-binding:
    rationale: "A compatible Semgrep release removes the need for the vulnerable MCP waiver."
    stakeholder_refs:
      - "nold-ai/specfact-cli#692"
    touchpoints:
      - id: dependency-policy
        kind: config
        locator: "pyproject.toml"
      - id: frozen-resolution
        kind: lockfile
        locator: "uv.lock"
      - id: frozen-export
        kind: lockfile
        locator: "requirements/ci/locked.txt"
      - id: audit-exceptions
        kind: config
        locator: "ci/vulnerability-audit-exceptions.json"
      - id: dependency-regression
        kind: test_file
        locator: "tests/unit/scripts/test_reproducible_delivery.py"
    verification_cases:
      - case_id: RELEASE-692-MCP-S01
        scenario_id: frozen-static-analysis-uses-a-non-vulnerable-mcp-binding
        method: test
        intent: "Prove every Semgrep surface selects a release bound to fixed MCP and no stale waiver remains."
        observable: >-
          Semgrep floors are at least 1.175.0, frozen inputs contain Semgrep
          1.175.0 and MCP 1.29.0, MCP stays out of core runtime, and the audit
          exception register has no MCP entry.
        selector:
          runner: pytest
          node_id: tests/unit/scripts/test_reproducible_delivery.py::test_reproducible_delivery_pins_semgrep_with_fixed_mcp_without_waiver
  openspec:fix-release-promotion-security-gates:trustworthy-green-checks:retained-red-proof-uses-an-exact-owner-approved-sut-path-policy:
    rationale: "Retained red evidence permits only exact owner-approved regular-file SUT paths to change after red."
    stakeholder_refs:
      - "nold-ai/specfact-cli#692"
      - "nold-ai/specfact-cli#698"
    touchpoints:
      - id: requirements-mapping
        kind: config
        locator: "openspec/changes/fix-release-promotion-security-gates/requirements-evidence.yaml"
      - id: proof-provenance-anchor
        kind: source_file
        locator: "scripts/requirements_proof_provenance.py"
      - id: proof-executor
        kind: source_file
        locator: "scripts/requirements_proof_executor.py"
      - id: explicit-proof-plugin
        kind: source_file
        locator: "scripts/requirements_proof_pytest_plugin.py"
      - id: frozen-resolution
        kind: lockfile
        locator: "uv.lock"
      - id: path-policy-regression
        kind: test_file
        locator: "tests/unit/scripts/test_requirements_proof_path_policy.py"
    verification_cases:
      - case_id: RELEASE-692-PATH-S01
        scenario_id: retained-red-proof-uses-an-exact-owner-approved-sut-path-policy
        method: test
        intent: "Prove an exact owner-approved regular-file SUT touchpoint can change after red."
        observable: "Only the exact literal locator marked mutable_after_red true is accepted."
        selector:
          runner: pytest
          node_id: tests/unit/scripts/test_requirements_proof_path_policy.py::test_exact_mutable_sut_path_is_allowed_after_red
      - case_id: RELEASE-692-PATH-S02
        scenario_id: retained-red-proof-uses-an-exact-owner-approved-sut-path-policy
        method: test
        intent: "Prove complete commit history retains restored paths and both move endpoints."
        observable: "Changed-then-restored, renamed, and copied paths each require exact authority."
        selector:
          runner: pytest
          node_id: tests/unit/scripts/test_requirements_proof_path_policy.py::test_complete_history_retains_restored_rename_and_copy_paths
      - case_id: RELEASE-692-PATH-S03
        scenario_id: retained-red-proof-uses-an-exact-owner-approved-sut-path-policy
        method: test
        intent: "Prove tests, harness inputs, and fixed trust anchors cannot become mutable SUT."
        observable: "Every frozen role remains stale even when mapping content requests mutable_after_red."
        selector:
          runner: pytest
          node_id: tests/unit/scripts/test_requirements_proof_path_policy.py::test_frozen_proof_inputs_cannot_be_authorized_as_mutable
      - case_id: RELEASE-692-PATH-S04
        scenario_id: retained-red-proof-uses-an-exact-owner-approved-sut-path-policy
        method: test
        intent: "Prove ambiguous or over-broad mapping authority fails closed."
        observable: >-
          Globs, prefixes, directories, collisions, duplicates, role
          mismatches, missing paths, and non-regular files are rejected.
        selector:
          runner: pytest
          node_id: tests/unit/scripts/test_requirements_proof_path_policy.py::test_ambiguous_mutable_sut_mapping_fails_closed
      - case_id: RELEASE-692-PATH-S05
        scenario_id: retained-red-proof-uses-an-exact-owner-approved-sut-path-policy
        method: test
        intent: "Prove unmapped production changes remain stale."
        observable: "Any touched path without eligible exact mutable authority yields stale-red-proof."
        selector:
          runner: pytest
          node_id: tests/unit/scripts/test_requirements_proof_path_policy.py::test_unmapped_changed_path_remains_stale
      - case_id: RELEASE-692-PATH-S06
        scenario_id: retained-red-proof-uses-an-exact-owner-approved-sut-path-policy
        method: test
        intent: "Prove ancestor conftests and root-level test support cannot be mapped as mutable SUT."
        observable: >-
          Every applicable conftest remains frozen for nested and root-level
          selectors even when it is mislabeled as source_file.
        selector:
          runner: pytest
          node_id: tests/unit/scripts/test_requirements_proof_path_policy.py::test_applicable_conftests_cannot_be_authorized_as_mutable
      - case_id: RELEASE-692-PATH-S07
        scenario_id: retained-red-proof-uses-an-exact-owner-approved-sut-path-policy
        method: test
        intent: "Prove copy detection retains an unchanged frozen source endpoint."
        observable: >-
          A delete and byte-identical recreation at an approved destination is
          reported as a copy from the frozen test source and remains stale.
        selector:
          runner: pytest
          node_id: tests/unit/scripts/test_requirements_proof_path_policy.py::test_copy_from_unchanged_frozen_source_is_retained
      - case_id: RELEASE-692-PATH-S08
        scenario_id: retained-red-proof-uses-an-exact-owner-approved-sut-path-policy
        method: test
        intent: "Prove a repository plugin declared by an applicable conftest remains frozen harness input."
        observable: >-
          A literal pytest_plugins module cannot be relabeled as mutable SUT,
          including when its path is outside the selected test support tree.
        selector:
          runner: pytest
          node_id: tests/unit/scripts/test_requirements_proof_path_policy.py::test_conftest_declared_repository_plugin_cannot_be_authorized_as_mutable
  openspec:fix-release-promotion-security-gates:trustworthy-green-checks:repository-path-operands-cannot-become-command-options:
    rationale: "Repository filenames must not be interpreted as ripgrep options or preprocessors."
    stakeholder_refs:
      - "nold-ai/specfact-cli#692"
      - "nold-ai/specfact-cli#698"
    touchpoints:
      - id: document-frontmatter-scan
        kind: source_file
        locator: "scripts/check_doc_frontmatter.py"
      - id: document-frontmatter-regression
        kind: test_file
        locator: "tests/unit/scripts/test_doc_frontmatter/test_validation.py"
    verification_cases:
      - case_id: RELEASE-692-DOC-S01
        scenario_id: repository-path-operands-cannot-become-command-options
        method: test
        intent: "Prove ripgrep option parsing ends before repository-controlled path operands."
        observable: "The document-owner scan inserts an exact -- separator before every file path."
        selector:
          runner: pytest
          node_id: tests/unit/scripts/test_doc_frontmatter/test_validation.py::TestMissingDocOwnerDetection::test_repository_paths_follow_option_terminator
  openspec:fix-release-promotion-security-gates:trustworthy-green-checks:requirements-proof-supports-verified-pull-request-amendment-cycles:
    rationale: "Late review fixes need another authenticated red-to-green cycle on the same pull request."
    stakeholder_refs:
      - "nold-ai/specfact-cli#692"
      - "nold-ai/specfact-cli#698"
    touchpoints:
      - id: requirements-workflow
        kind: workflow
        locator: ".github/workflows/requirements-evidence.yml"
      - id: cycle-authority
        kind: source_file
        locator: "scripts/requirements_cycle_base.py"
      - id: proof-provenance
        kind: source_file
        locator: "scripts/requirements_proof_provenance.py"
      - id: cycle-authority-regression
        kind: test_file
        locator: "tests/unit/scripts/test_requirements_cycle_base.py"
      - id: workflow-regression
        kind: test_file
        locator: "tests/unit/workflows/test_requirements_evidence_delivery_workflow.py"
      - id: amendment-workflow-regression
        kind: test_file
        locator: "tests/unit/workflows/test_requirements_evidence_amendment_review_regressions.py"
      - id: cycle-revalidation-regression
        kind: test_file
        locator: "tests/unit/scripts/test_requirements_proof_provenance_review_regressions.py"
      - id: cycle-authority-regression-v2
        kind: test_file
        locator: "tests/unit/scripts/test_requirements_cycle_base_v2.py"
      - id: amendment-bootstrap-regression-v2
        kind: test_file
        locator: "tests/unit/scripts/test_requirements_amendment_bootstrap_v2.py"
      - id: bootstrap-authority-regression
        kind: test_file
        locator: "tests/unit/scripts/test_requirements_bootstrap_authority.py"
      - id: cycle-review-regression
        kind: test_file
        locator: "tests/unit/scripts/test_requirements_cycle_base_review_regressions.py"
      - id: proof-review-regression-v2
        kind: test_file
        locator: "tests/unit/scripts/test_requirements_proof_provenance_review_regressions_v2.py"
    verification_cases:
      - case_id: RELEASE-692-CYCLE-S01
        scenario_id: requirements-proof-supports-verified-pull-request-amendment-cycles
        method: test
        intent: "Prove only the same PR's successful verified ancestor can narrow the amendment-cycle boundary."
        observable: >-
          Matching run, artifact, branch, PR, repository, final source, and
          ancestry pass; failed, foreign, tampered, or non-ancestor candidates
          are rejected.
        selector:
          runner: pytest
          node_id: tests/unit/scripts/test_requirements_cycle_base.py::test_cycle_base_accepts_only_matching_verified_pull_request_history
      - case_id: RELEASE-692-CYCLE-S02
        scenario_id: requirements-proof-supports-verified-pull-request-amendment-cycles
        method: test
        intent: "Prove maturity and red provenance use the verified cycle delta while the full OpenSpec plan keeps the PR base."
        observable: >-
          The workflow discovers a verified cycle base, uses it for maturity and
          red binding, and retains origin/dev for complete change planning.
        selector:
          runner: pytest
          node_id: tests/unit/workflows/test_requirements_evidence_amendment_review_regressions.py::test_amendment_workflow_supports_verified_cycle_selection
      - case_id: RELEASE-692-CYCLE-S03
        scenario_id: requirements-proof-supports-verified-pull-request-amendment-cycles
        method: test
        intent: "Prove external authority bypasses only the matching green producer self-authorship predicate."
        observable: "An exact artifact-bound authority digest admits the verified green; absence or mismatch rejects it."
        selector:
          runner: pytest
          node_id: tests/unit/scripts/test_requirements_cycle_base.py::test_cycle_base_accepts_self_authored_green_only_with_matching_external_authority_digest
      - case_id: RELEASE-692-CYCLE-S04
        scenario_id: requirements-proof-supports-verified-pull-request-amendment-cycles
        method: test
        intent: "Prove the external bootstrap does not preempt a later ordinary amendment cycle."
        observable: >-
          The workflow live-revalidates external authority, tries current
          verified green and failed-red history, and uses the fixed external
          pair only as fallback.
        selector:
          runner: pytest
          node_id: tests/unit/workflows/test_requirements_evidence_amendment_review_regressions.py::test_exact_external_amendment_bootstraps_later_generic_cycle_selection
      - case_id: RELEASE-692-CYCLE-S05
        scenario_id: requirements-proof-supports-verified-pull-request-amendment-cycles
        method: test
        intent: "Prove ordinary cycle proof reuse revalidates the exact externally authorized green artifact."
        observable: >-
          The derived authority receipt retains the external digest and
          provenance forwards it into live cycle-base validation.
        selector:
          runner: pytest
          node_id: tests/unit/scripts/test_requirements_proof_provenance_review_regressions.py::test_external_digest_is_forwarded_during_ordinary_cycle_revalidation
      - case_id: RELEASE-692-CYCLE-S06
        scenario_id: requirements-proof-supports-verified-pull-request-amendment-cycles
        method: test
        intent: "Prove an ordinary hint's public digest is never accepted without fresh external capability validation."
        observable: >-
          Reuse re-fetches the fixed external inputs, executes the exact
          validator, matches the fresh receipt digest, and only then validates
          the ordinary same-PR green.
        selector:
          runner: pytest
          node_id: tests/unit/scripts/test_requirements_proof_provenance_review_regressions.py::test_ordinary_cycle_revalidates_the_live_external_capability
      - case_id: RELEASE-692-CYCLE-S07
        scenario_id: requirements-proof-supports-verified-pull-request-amendment-cycles
        method: test
        intent: "Prove a public external digest cannot authenticate a self-authored candidate artifact."
        observable: "Digest-only authority is rejected without the exact live-produced receipt and approved root chain."
        selector:
          runner: pytest
          node_id: tests/unit/scripts/test_requirements_cycle_base_v2.py::test_public_external_digest_cannot_authenticate_self_authored_candidate
      - case_id: RELEASE-692-CYCLE-S08
        scenario_id: requirements-proof-supports-verified-pull-request-amendment-cycles
        method: test
        intent: "Prove descendant cycle reuse binds the exact external receipt, root history, and candidate execution proof."
        observable: >-
          The exact receipt-bound descendant passes; expiry, locator, root-tree,
          and candidate-artifact tampering each fail closed.
        selector:
          runner: pytest
          node_id: tests/unit/scripts/test_requirements_cycle_base_v2.py::test_exact_live_receipt_authenticates_bound_descendant_candidate
      - case_id: RELEASE-692-CYCLE-S09
        scenario_id: requirements-proof-supports-verified-pull-request-amendment-cycles
        method: test
        intent: "Prove the V2 bootstrap derives its red subset only from immutable raw JUnit outcomes."
        observable: >-
          A diagnostic report cannot relabel a passing testcase as failed; the
          normalized proof contains only exact raw failures from the approved plan.
        selector:
          runner: pytest
          node_id: tests/unit/scripts/test_requirements_amendment_bootstrap_v2.py::test_v2_bootstrap_derives_red_subset_from_raw_case_outcomes
      - case_id: RELEASE-692-CYCLE-S10
        scenario_id: requirements-proof-supports-verified-pull-request-amendment-cycles
        method: test
        intent: "Prove the stale-producer capability accepts only the exact bound raw green/red outcome boundary."
        observable: >-
          Exact independently bound all-passing green and approved red outcomes
          pass; changed diagnostics, superseded authority, skipped green cases,
          and skipped red cases fail closed.
        selector:
          runner: pytest
          node_id: tests/unit/scripts/test_requirements_amendment_bootstrap_v2.py::test_v3_bootstrap_accepts_only_the_exact_stale_producer_boundary
      - case_id: RELEASE-692-CYCLE-S11
        scenario_id: requirements-proof-supports-verified-pull-request-amendment-cycles
        method: test
        intent: "Prove bootstrap red history accepts only the exact authenticated OpenSpec change scope."
        observable: >-
          A future explicit change ID is accepted while mismatched or additional
          change directories and unknown production paths are rejected.
        selector:
          runner: pytest
          node_id: tests/unit/scripts/test_requirements_change_scope_review_regressions.py::test_bootstrap_red_history_uses_a_positive_test_and_change_artifact_allowlist
      - case_id: RELEASE-692-CYCLE-S12
        scenario_id: requirements-proof-supports-verified-pull-request-amendment-cycles
        method: test
        intent: "Prove amendment-cycle red history accepts only its authenticated OpenSpec change scope."
        observable: "The exact declared change passes; a mismatched or second change directory fails closed."
        selector:
          runner: pytest
          node_id: tests/unit/scripts/test_requirements_change_scope_review_regressions.py::test_red_history_accepts_one_authenticated_change_scope_and_rejects_two
      - case_id: RELEASE-692-CYCLE-S13
        scenario_id: requirements-proof-supports-verified-pull-request-amendment-cycles
        method: test
        intent: "Prove retained-proof red history accepts only its authenticated OpenSpec change scope."
        observable: "The exact declared change passes while unknown, mismatched, or additional change paths fail closed."
        selector:
          runner: pytest
          node_id: tests/unit/scripts/test_requirements_proof_provenance_review_regressions_v2.py::test_red_history_uses_a_positive_test_and_change_artifact_allowlist
