          user, read-only checkout, hidden Git metadata, no network or
          capabilities, and control-group kill/runtime limits.
        selector:
          runner: pytest
          node_id: tests/unit/scripts/test_requirements_proof_executor.py::test_systemd_service_request_closes_identity_mount_network_and_lifecycle_boundaries
