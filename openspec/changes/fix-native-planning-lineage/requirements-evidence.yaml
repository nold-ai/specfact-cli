      - nold-ai/specfact-cli#760
    touchpoints:
      - id: independent-lineage
        kind: config_file
        locator: .github/workflows/requirements-evidence.yml
    verification_cases:
      - case_id: NATIVE-FORGERY
        scenario_id: reject-independent-lineage-forgery
        method: test
        intent: Exercise unrelated trust, unrelated planning and candidate-newer evidence in actual Git histories.
        observable: The real consumer preflight rejects every invalid boundary before provider execution.
        selector:
          runner: pytest
          node_id: tests/unit/security/test_native_planning_lineage.py::test_independent_lineage_rejects_forged_trust_or_parent
