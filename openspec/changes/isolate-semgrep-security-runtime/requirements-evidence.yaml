        kind: config_file
        locator: openspec/changes/isolate-semgrep-security-runtime/specs/isolated-scanner-runtime/spec.md
    verification_cases:
      - case_id: SCANNER-FINAL-PACKAGE-VERSION-FOLLOWS-VERIFIED-CORE-STATE
        scenario_id: coherent-hotfix-delivery-and-duplicate-disposition
        method: inspection
        intent: 'Inspect planned scenario: Final package version follows verified core state. GIVEN a compatible
          verified implementation and the latest dev and PyPI versions WHEN the patch release is prepared THEN all
          four canonical version sources, generated metadata and changelog agree on a patch version strictly ahead
          of PyPI, followed by fresh final review.'
        observable: The planned scenario retains this acceptance contract; no runtime, authored-test or remediation
