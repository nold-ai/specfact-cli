schema_version: '2'
requirements:
  openspec:isolate-semgrep-security-runtime:isolated-scanner-runtime:exclude-compromised-certificate-authorities-from-delivered-trust:
    rationale: Remove compromised certificate authority trust from the installed frozen Python delivery.
    stakeholder_refs:
      - nold-ai/specfact-cli#780
    touchpoints:
      - id: runtime-floor
        kind: config_file
        locator: pyproject.toml
      - id: frozen-delivery
        kind: config_file
        locator: requirements/ci/locked.txt
      - id: installed-trust-test
        kind: test
        locator: tests/unit/security/test_certificate_trust_store.py
    verification_cases:
      - case_id: CERTIFI-COMPROMISED-ROOT-ABSENT
        scenario_id: exclude-compromised-certificate-authorities-from-delivered-trust
        method: test
        intent: Inspect the installed certifi CA bundle through an SSL context after frozen dependency installation.
        observable: The trust store is nonempty and excludes the compromised emSign ECC Root CA - G3 DER SHA256.
        selector:
          runner: pytest
          node_id: tests/unit/security/test_certificate_trust_store.py::test_certifi_bundle_excludes_compromised_emsign_root
