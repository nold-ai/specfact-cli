  openspec:isolate-semgrep-security-runtime:isolated-scanner-runtime:bound-the-temporary-official-mcp-advisory-exception:
    rationale: Keep both main audit lanes strict with one exact, expiring owner-approved exception.
    stakeholder_refs:
    - nold-ai/specfact-cli#780
    touchpoints:
    - id: touchpoint-1
      kind: config_file
      locator: pyproject.toml
    - id: touchpoint-2
      kind: config_file
      locator: uv.lock
    - id: touchpoint-3
      kind: config_file
      locator: requirements/ci/locked.txt
    - id: touchpoint-4
      kind: config_file
      locator: ci/vulnerability-audit-exceptions.json
    - id: touchpoint-5
      kind: test
      locator: tests/unit/security/test_release_promotion_security_gates.py
    - id: touchpoint-6
      kind: test
      locator: tests/unit/scripts/test_security_audit_gate.py
    verification_cases:
    - case_id: MCP-OFFICIAL-EXCEPTION-EXACT
      scenario_id: bound-the-temporary-official-mcp-advisory-exception
      method: test
      intent: Bind the official scanner graph and exact advisory record.
      observable: Only official Semgrep 1.179.0 and MCP 1.29.0 occur with the approved exact exception.
      selector:
        runner: pytest
        node_id: tests/unit/security/test_release_promotion_security_gates.py::test_frozen_graph_uses_official_semgrep_with_bounded_mcp_exception
    - case_id: MCP-EXACT-CVE
      scenario_id: bound-the-temporary-official-mcp-advisory-exception
      method: test
      intent: Exercise the committed register through the existing strict audit gate.
      observable: Only the approved package, version, and advisory inside the inclusive date window is waived.
      selector:
        runner: pytest
        node_id: tests/unit/scripts/test_security_audit_gate.py::test_committed_mcp_exception_is_exact_and_time_bounded[exact-cve]
    - case_id: MCP-EXACT-GHSA
      scenario_id: bound-the-temporary-official-mcp-advisory-exception
      method: test
      intent: Exercise the committed register through the existing strict audit gate.
      observable: Only the approved package, version, and advisory inside the inclusive date window is waived.
      selector:
        runner: pytest
        node_id: tests/unit/scripts/test_security_audit_gate.py::test_committed_mcp_exception_is_exact_and_time_bounded[exact-ghsa]
    - case_id: MCP-EXPIRY-DAY
      scenario_id: bound-the-temporary-official-mcp-advisory-exception
      method: test
      intent: Exercise the committed register through the existing strict audit gate.
      observable: Only the approved package, version, and advisory inside the inclusive date window is waived.
      selector:
        runner: pytest
        node_id: tests/unit/scripts/test_security_audit_gate.py::test_committed_mcp_exception_is_exact_and_time_bounded[expiry-day]
    - case_id: MCP-EXPIRED
      scenario_id: bound-the-temporary-official-mcp-advisory-exception
      method: test
      intent: Exercise the committed register through the existing strict audit gate.
      observable: Only the approved package, version, and advisory inside the inclusive date window is waived.
      selector:
        runner: pytest
        node_id: tests/unit/scripts/test_security_audit_gate.py::test_committed_mcp_exception_is_exact_and_time_bounded[expired]
    - case_id: MCP-FUTURE-REVIEW
      scenario_id: bound-the-temporary-official-mcp-advisory-exception
      method: test
      intent: Exercise the committed register through the existing strict audit gate.
      observable: Only the approved package, version, and advisory inside the inclusive date window is waived.
      selector:
        runner: pytest
        node_id: tests/unit/scripts/test_security_audit_gate.py::test_committed_mcp_exception_is_exact_and_time_bounded[future-review]
