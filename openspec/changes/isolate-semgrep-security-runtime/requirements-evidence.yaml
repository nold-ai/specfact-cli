schema_version: '2'
requirements:
  ? openspec:isolate-semgrep-security-runtime:isolated-scanner-runtime:exclude-compromised-certificate-authorities-from-delivered-trust
  : rationale: Inspect the delivery artifact independently of installed verifier packages.
    stakeholder_refs: &id001
    - nold-ai/specfact-cli#780
    touchpoints: &id002
    - id: touchpoint-1
      kind: config_file
      locator: pyproject.toml
    - id: touchpoint-2
      kind: config_file
      locator: uv.lock
    - id: touchpoint-3
      kind: config_file
      locator: requirements/ci/locked.txt
    - id: touchpoint-4
      kind: test
      locator: tests/unit/security/test_frozen_dependency_artifacts.py
    - id: touchpoint-5
      kind: test
      locator: tests/unit/security/test_frozen_gitpython_compatibility.py
    - id: touchpoint-6
      kind: test
      locator: tests/unit/security/test_frozen_jwt_compatibility.py
    - id: touchpoint-7
      kind: test
      locator: tests/unit/security/test_release_dependency_selection.py
    verification_cases:
    - case_id: CERTIFI-COMPROMISED-ROOT-ABSENT
      scenario_id: exclude-compromised-certificate-authorities-from-delivered-trust
      method: test
      intent: Inspect the exact frozen wheel and parse its inert CA data.
      observable: The trust store is nonempty and excludes the compromised certificate fingerprint.
      selector:
        runner: pytest
        node_id: tests/unit/security/test_frozen_dependency_artifacts.py::test_frozen_certifi_bundle_excludes_compromised_root
  openspec:isolate-semgrep-security-runtime:isolated-scanner-runtime:reject-submodule-checkouts-outside-the-repository:
    rationale: Inspect the delivery artifact independently of installed verifier packages.
    stakeholder_refs: *id001
    touchpoints: *id002
    verification_cases:
    - case_id: GITPYTHON-SUBMODULE-CONTAINMENT
      scenario_id: reject-submodule-checkouts-outside-the-repository
      method: test
      intent: Attempt an outside submodule update with clone boundary observation.
      observable: The path is rejected before clone and no outside directory is created.
      selector:
        runner: pytest
        node_id: tests/unit/security/test_frozen_gitpython_compatibility.py::test_submodule_update_rejects_outside_checkout_before_clone
  openspec:isolate-semgrep-security-runtime:isolated-scanner-runtime:preserve-jwt-verification-options-and-compatibility:
    rationale: Inspect the delivery artifact independently of installed verifier packages.
    stakeholder_refs: *id001
    touchpoints: *id002
    verification_cases:
    - case_id: PYJWT-OPTIONS-AND-EXPIRY
      scenario_id: preserve-jwt-verification-options-and-compatibility
      method: test
      intent: Exercise the frozen JWT artifact in an isolated process.
      observable: The frozen artifact preserves inspection options, rejects expiry on reuse, and decodes signed and padded
        tokens without mutating caller options.
      selector:
        runner: pytest
        node_id: tests/unit/security/test_frozen_jwt_compatibility.py::test_inspection_preserves_options_and_expiry_on_reuse
  openspec:isolate-semgrep-security-runtime:isolated-scanner-runtime:select-the-reviewed-compatible-tooling-graph:
