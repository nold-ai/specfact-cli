      - case_id: SCANNER-DUPLICATE-CLOSURE-FOLLOWS-AN-ACTUAL-REPLACEMENT
        scenario_id: coherent-hotfix-delivery-and-duplicate-disposition
        method: inspection
        intent: 'Inspect planned scenario: Duplicate closure follows an actual replacement. GIVEN a verified replacement
          implementation PR with complete security evidence WHEN a covered older dependency PR is closed THEN a
          preceding comment links the replacement and explains coverage, while unimplemented JSON migration and
          unrelated updates retain explicit dispositions.'
        observable: The planned scenario retains this acceptance contract; no runtime, authored-test or remediation
