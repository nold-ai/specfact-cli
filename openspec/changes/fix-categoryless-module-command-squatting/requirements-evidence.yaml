      - case_id: SQUAT-CATEGORY
        scenario_id: workspace-packages-cannot-supply-official-category-roots
        method: test
        intent: Attempt unsigned claims to all six official category roots with existing root/module sentinel loaders
          and then empty registries in both grouping modes.
        observable: Original loader and metadata identities and Typer apps remain unchanged; the unverified project
          package cannot create or extend roots, activate imports or create category mounts.
        selector:
          runner: pytest
          node_id: tests/unit/security/test_module_command_squatting.py::test_workspace_cannot_supply_official_category_roots
      - case_id: SQUAT-IMPORT-FREE
        scenario_id: workspace-packages-cannot-supply-official-category-roots
        method: test
        intent: Invoke public grouped registration for a category-less project root claim while observing imports.
        observable: Admission imports no category builder or initializes an app; root/module registries, active imports
          and the hostile execution marker remain empty.
        selector:
          runner: pytest
          node_id: tests/unit/security/test_module_command_squatting.py::test_workspace_eligibility_does_not_import_category_builders
      - case_id: SQUAT-FLAT-PROJECT
