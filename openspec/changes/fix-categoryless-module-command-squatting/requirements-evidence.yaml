      - id: authenticated-manifest-binding
        kind: code_symbol
        locator: src/specfact_cli/registry/module_installer.py::_metadata_matches_authenticated_manifest
    verification_cases:
      - case_id: SQUAT-VERIFIED-PROJECT-GROUPED
        scenario_id: authenticated-project-bundles-retain-official-category-roots
        method: test
        intent: Register the real signed official project project artifact in grouped mode, then exercise unverified
          replacements and verifier failures.
        observable: The authentic package retains its root, activated source and loadable Typer app; unsigned, tampered,
          forged-publisher/signature, receipt, workspace-key, untracked Git source, escaping-directory-symlink,
          loadable unsigned cached/standalone bytecode and excluded executable source copies plus missing/empty/malformed
          keys and unavailable verification cause no root or active-import effects. Authentic current-interpreter
          caches compiled from covered signed source retain verified repeated registration and loading.
        selector:
          runner: pytest
          node_id: tests/unit/security/test_project_bundle_authority.py::test_verified_project_bundle_preserves_root_and_rejects_forgery[project-grouped]
