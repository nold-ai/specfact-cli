    workspace-packages-cannot-supply-official-category-roots"
  : rationale: Unauthenticated project category capabilities cannot create or extend official roots, including
      indirect bundle mounts and member loaders.
    stakeholder_refs:
      - nold-ai/specfact-cli#718
    touchpoints:
      - id: registration-policy
        kind: code_symbol
        locator: src/specfact_cli/registry/module_packages.py::_package_local_registration_eligible
