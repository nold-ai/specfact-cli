schema_version: "2"
requirements:
  openspec:module-scope-02-preserve-user-installs:module-scope-diagnostics:module-doctor-reports-effective-and-shadowed-module-copies:
    rationale: "Module diagnostics must explain actual source precedence without treating valid user installations as stale."
    stakeholder_refs:
      - "nold-ai/specfact-cli#699"
      - "nold-ai/specfact-cli-modules#452"
    touchpoints:
      - id: discovery-shadow-warning
        kind: source_file
        locator: "src/specfact_cli/registry/module_discovery.py"
      - id: module-doctor-guidance
        kind: source_file
        locator: "src/specfact_cli/modules/module_registry/src/commands.py"
    verification_cases:
      - case_id: MSI-CORE-001
        scenario_id: module-doctor-reports-effective-and-shadowed-module-copies
        method: test
        intent: "Report both copies and preserve the user-scoped installation."
        observable: "Doctor reports both origins and paths, preserves the user copy, and emits no uninstall advice."
        selector:
          runner: pytest
          node_id: tests/unit/modules/module_registry/test_commands.py::test_doctor_reports_effective_and_shadowed_duplicate_modules
      - case_id: MSI-CORE-002
        scenario_id: module-doctor-reports-effective-and-shadowed-module-copies
        method: test
        intent: "Keep runtime precedence diagnostics non-destructive."
        observable: "Discovery states that the user copy remains installed, qualifies availability, and emits no uninstall advice."
        selector:
          runner: pytest
          node_id: tests/unit/registry/test_module_discovery.py::test_project_shadow_warning_is_actionable_and_emitted_once
      - case_id: MSI-CORE-003
        scenario_id: module-doctor-reports-effective-and-shadowed-module-copies
        method: test
        intent: "Name the source that actually shadows the user-scoped copy."
        observable: "Doctor identifies built-in precedence without claiming project precedence."
        selector:
          runner: pytest
          node_id: tests/unit/modules/module_registry/test_commands.py::test_doctor_shadowing_guidance_names_builtin_effective_source
      - case_id: MSI-CORE-004
        scenario_id: module-doctor-reports-effective-and-shadowed-module-copies
        method: test
        intent: "Show that preservation leaves the user copy discoverable where no project copy shadows it."
        observable: "Discovery selects the user-scoped copy in a workspace without the project copy."
        selector:
          runner: pytest
          node_id: tests/unit/registry/test_module_discovery.py::test_user_module_is_discovered_outside_shadowing_project
