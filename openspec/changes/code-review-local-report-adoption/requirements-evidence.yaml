    touchpoints:
      - id: planned-spec
        kind: config_file
        locator: openspec/changes/code-review-local-report-adoption/specs/local-review-consumer/spec.md
    verification_cases:
      - case_id: LOCAL-PRESERVE-INCOMPLETE-SHADOW-RESULTS
        scenario_id: preserve-authoritative-local-truth
        method: inspection
        intent: 'Inspect planned scenario: Preserve incomplete shadow results. Given producer failure, uncertainty,
          or incomplete evidence in shadow mode; when core renders the local result; then the summary and machine
          evidence retain the adverse truth even when enforcement is non-blocking.'
        observable: The planned spec retains this scenario; no runtime or test maturity is claimed.
      - case_id: LOCAL-REJECT-SCORE-BASED-SUCCESS
        scenario_id: preserve-authoritative-local-truth
        method: inspection
        intent: 'Inspect planned scenario: Reject score based success. Given a favorable score or fixability alongside
          adverse assurance or contradictory process evidence; when core decides the local result; then it does
          not replace producer assurance and completeness with success.'
        observable: The planned spec retains this scenario; no runtime or test maturity is claimed.
  openspec:code-review-local-report-adoption:local-review-consumer:separate-installed-cli-and-project-runtime:
    rationale: Plan ordinary trusted-local report adoption without claiming implementation.
    stakeholder_refs:
      - nold-ai/specfact-cli#769
    touchpoints:
      - id: planned-spec
        kind: config_file
        locator: openspec/changes/code-review-local-report-adoption/specs/local-review-consumer/spec.md
    verification_cases:
      - case_id: LOCAL-RUN-AN-EXTERNALLY-INSTALLED-CLI
        scenario_id: separate-installed-cli-and-project-runtime
        method: inspection
        intent: 'Inspect planned scenario: Run an externally installed CLI. Given a supported signed core/module
          pair installed by pipx, uv tool, or uvx and a different project Python; when ordinary local review runs;
          then core loads the compatible module while modules resolve the trusted project runtime without injecting
          dependencies into the project environment.'
        observable: The planned spec retains this scenario; no runtime or test maturity is claimed.
      - case_id: LOCAL-HANDLE-UVX-WITHOUT-PIP
        scenario_id: separate-installed-cli-and-project-runtime
        method: inspection
        intent: 'Inspect planned scenario: Handle uvx without pip. Given a uvx tool environment without pip; when
          installation compatibility provisions required tool dependencies; then it uses supported external tooling
          or declarations rather than unmanaged mutation.'
        observable: The planned spec retains this scenario; no runtime or test maturity is claimed.
      - case_id: LOCAL-PRESERVE-THE-RUNTIME-DESCRIPTOR
        scenario_id: separate-installed-cli-and-project-runtime
        method: inspection
        intent: 'Inspect planned scenario: Preserve the runtime descriptor. Given a supported --project-runtime
          descriptor; when core invokes the module; then it forwards descriptor semantics without treating the value
          as an interpreter path.'
        observable: The planned spec retains this scenario; no runtime or test maturity is claimed.
