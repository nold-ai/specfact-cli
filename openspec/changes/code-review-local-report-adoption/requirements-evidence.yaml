requirements:
  openspec:code-review-local-report-adoption:local-review-consumer:explicit-report-schema-dispatch:
    rationale: Plan ordinary trusted-local report adoption without claiming implementation.
    stakeholder_refs:
      - nold-ai/specfact-cli#769
    touchpoints:
      - id: planned-spec
        kind: config_file
        locator: openspec/changes/code-review-local-report-adoption/specs/local-review-consumer/spec.md
    verification_cases:
      - case_id: LOCAL-SELECT-THE-SCHEMA-2.0-CONSUMER
        scenario_id: explicit-report-schema-dispatch
        method: inspection
        intent: 'Inspect planned scenario: Select the schema 2.0 consumer. Given a valid local schema 2.0 report;
          when an ordinary core consumer reads the report; then it selects the schema 2.0 contract and does not
          apply historical 1.6 semantics.'
        observable: The planned spec retains this scenario; no runtime or test maturity is claimed.
      - case_id: LOCAL-BOUND-HISTORICAL-SUPPORT
        scenario_id: explicit-report-schema-dispatch
        method: inspection
        intent: 'Inspect planned scenario: Bound historical support. Given a historical 1.6 report at a consumer
          that supports it; when the consumer dispatches by version; then it uses only supported historical semantics.'
        observable: The planned spec retains this scenario; no runtime or test maturity is claimed.
      - case_id: LOCAL-REJECT-UNSUPPORTED-EVIDENCE
        scenario_id: explicit-report-schema-dispatch
        method: inspection
        intent: 'Inspect planned scenario: Reject unsupported evidence. Given an unsupported major version or malformed
          required report data; when the consumer parses the report; then it rejects the input without claiming
          successful assurance.'
        observable: The planned spec retains this scenario; no runtime or test maturity is claimed.
  openspec:code-review-local-report-adoption:local-review-consumer:preserve-authoritative-local-truth:
    rationale: Plan ordinary trusted-local report adoption without claiming implementation.
    stakeholder_refs:
