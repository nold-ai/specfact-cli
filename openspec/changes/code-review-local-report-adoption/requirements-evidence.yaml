        intent: 'Inspect planned scenario: Retain separate protected acceptance. Given a local schema 2.0 report;
          when a protected #680 or C15 #679 consumer is considered; then local evidence does not satisfy the protected
          capsule contract or change C15 owners, status, or acceptance.'
        observable: The planned spec retains this scenario; no runtime or test maturity is claimed.
      - case_id: LOCAL-RETAIN-INDEPENDENT-SECURITY-AND-SIGNATURES
        scenario_id: keep-protected-contracts-and-independent-gates-separate
