schema_version: '2'
requirements:
  openspec:pr785-ci-signing-recovery:pr785-signing-probe:existing-normal-validation-triggers-are-removed:
    rationale: Refuse unapproved execution contexts before object writes.
    stakeholder_refs:
      - nold-ai/specfact-cli#780
    touchpoints:
      - id: executor
        kind: ci_workflow
        locator: .github/workflows/specfact.yml
      - id: probe-policy
        kind: code
        locator: scripts/pr785_signing_recovery.py
      - id: probe-inputs
        kind: config_file
        locator: ci/recovery/pr785-signing-inputs.json
      - id: probe-tests
        kind: test
        locator: tests/unit/scripts/test_pr785_signing_recovery.py
      - id: prefix7-tests
        kind: test
        locator: tests/unit/scripts/test_pr785_signing_prefix7.py
    verification_cases:
      - case_id: PR785-PROBE-001
        scenario_id: existing-normal-validation-triggers-are-removed
        method: test
        intent: executor is dispatch only.
        observable: The workflow has only manual dispatch, one bounded job, pinned actions, scoped permissions and
          no secret or module access.
        selector:
          runner: pytest
          node_id: tests/unit/scripts/test_pr785_signing_recovery.py::test_executor_is_dispatch_only
      - case_id: PR785-PROBE-062
        scenario_id: existing-normal-validation-triggers-are-removed
        method: test
        intent: Expose only probe and prefix7, default probe, with unchanged bounded job and action pins.
        observable: Manual stage choices are exactly probe and prefix7, default probe; original action, job and
          permission controls remain.
        selector:
          runner: pytest
          node_id: tests/unit/scripts/test_pr785_signing_recovery.py::test_workflow_has_only_bounded_steps_and_pinned_actions
      - case_id: PR785-PREFIX7-326
        scenario_id: existing-normal-validation-triggers-are-removed
        method: test
        intent: workflow prefix artifact is stage bound.
        observable: The artifact name binds stage and current run, attempt and executor while preserving the prior
          Probe expansion.
        selector:
          runner: pytest
          node_id: tests/unit/scripts/test_pr785_signing_prefix7.py::test_workflow_prefix_artifact_is_stage_bound
