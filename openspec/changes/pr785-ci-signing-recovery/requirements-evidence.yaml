          against the immutable manifest.
        observable: All ten source records retain their independent digest; baseline tree, probe tree and probe
          bytes equal the independently grounded constants.
        selector:
          runner: pytest
          node_id: tests/unit/scripts/test_pr785_signing_recovery.py::test_complete_source_manifest_and_probe_bytes_are_frozen
