  openspec:pr785-ci-signing-recovery:pr785-signing-probe:signature-and-identity-verification:
    rationale: Conserve source identities and bound writes to the two independent inert probe objects.
    stakeholder_refs:
      - nold-ai/specfact-cli#780
    touchpoints:
      - id: executor
        kind: ci_workflow
        locator: .github/workflows/specfact.yml
      - id: probe-policy
        kind: code
        locator: scripts/pr785_signing_recovery.py
      - id: probe-inputs
        kind: config_file
        locator: ci/recovery/pr785-signing-inputs.json
      - id: probe-tests
