        scenario_id: signature-and-identity-verification
        method: test
        intent: probe api contract.
        observable: Exactly three pinned nonrecursive tree reads precede both independent commit requests; CI writes
          only commits with fixed main parents and exact reviewed trees.
        selector:
          runner: pytest
          node_id: tests/unit/scripts/test_pr785_signing_recovery.py::test_probe_api_contract
