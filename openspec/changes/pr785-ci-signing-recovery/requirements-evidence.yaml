        locator: ci/recovery/pr785-signing-inputs.json
      - id: probe-tests
        kind: test
        locator: tests/unit/scripts/test_pr785_signing_recovery.py
    verification_cases:
      - case_id: PR785-PROBE-001
        scenario_id: existing-normal-validation-triggers-are-removed
        method: test
        intent: executor is dispatch only.
        observable: The workflow has only manual dispatch, one bounded job, pinned actions, scoped permissions and
          no secret or module access.
        selector:
          runner: pytest
          node_id: tests/unit/scripts/test_pr785_signing_recovery.py::test_executor_is_dispatch_only
