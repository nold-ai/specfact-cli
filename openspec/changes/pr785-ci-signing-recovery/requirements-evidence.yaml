    rationale: Retain truthful receipts and keep root authentication and anchoring pending.
    stakeholder_refs:
      - nold-ai/specfact-cli#780
    touchpoints:
      - id: executor
        kind: ci_workflow
        locator: .github/workflows/specfact.yml
