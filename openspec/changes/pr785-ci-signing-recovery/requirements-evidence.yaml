        kind: config_file
        locator: ci/recovery/pr785-signing-inputs.json
      - id: probe-tests
        kind: test
        locator: tests/unit/scripts/test_pr785_signing_recovery.py
      - id: prefix7-tests
        kind: test
        locator: tests/unit/scripts/test_pr785_signing_prefix7.py
    verification_cases:
      - scenario_id: root-acceptance-remains-pending
        method: test
        intent: Run the real CLI and HTTP adapter against a fake network through complete probe success.
        observable: The persisted receipt binds the exact run, attempt, executor and manifest, contains two verified
          objects, leaves both anchor claims false, and retains every successful raw response in order without credentials.
        case_id: PR785-PROBE-067
        selector:
          runner: pytest
          node_id: tests/unit/scripts/test_pr785_signing_recovery.py::test_success_persists_bound_receipt_and_raw_responses
      - case_id: PR785-PROBE-169
        scenario_id: root-acceptance-remains-pending
        method: test
        intent: Accept only a complete same-run pair in the existing receipt.
        observable: Success returns the same receipt with exactly two distinct verified fixed-main children, run-bound
          intent and unchanged fields; both anchors stay false.
        selector:
          runner: pytest
          node_id: tests/unit/scripts/test_pr785_signing_recovery.py::test_success_returns_existing_receipt_with_complete_same_run_pair
      - case_id: PR785-PREFIX7-001
        scenario_id: root-acceptance-remains-pending
        method: test
        intent: prefix7 cli signs exact seven mapped trees.
        observable: A complete seven-step journal preserves exact known trees, mapped parents, current execution
          intent and fixed accepted witness, with seven POSTs and no anchoring claim.
        selector:
          runner: pytest
          node_id: tests/unit/scripts/test_pr785_signing_prefix7.py::test_prefix7_cli_signs_exact_seven_mapped_trees
