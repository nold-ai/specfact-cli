        kind: cli_command
        locator: scripts/generate-command-overview.py
      - id: command-validator
        kind: cli_command
        locator: scripts/check-command-contract.py
      - id: core-command-reference
        kind: documentation
        locator: docs/reference/commands.generated.md
      - id: agent-command-reference
        kind: documentation
        locator: llms.txt
    verification_cases:
      - case_id: DOCS16-04-01
        scenario_id: code-review-command-parity-includes-options-and-subgroups
        method: test
        intent: Exercise the parity gate against controlled generated-contract mutations without an external checkout.
        observable: Missing paths, ordinary options, arguments and subgroup entries each fail comparison.
        selector:
