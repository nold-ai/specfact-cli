requirements:
  ? openspec:docs-16-code-review-runtime-parity:code-review-module:portable-runtime-registration-is-documented-at-the-core-handoff
  : rationale: Maintainers must discover the installed portable review interface from the core command reference.
    stakeholder_refs:
      - nold-ai/specfact-cli#728
      - nold-ai/specfact-cli-modules#473
    touchpoints:
      - id: runtime-handoff
        kind: documentation
        locator: docs/modules/code-review.md
      - id: command-contract
        kind: config_file
        locator: docs/reference/commands.generated.json
    verification_cases:
      - case_id: DOCS16-01
        scenario_id: portable-runtime-registration-is-documented-at-the-core-handoff
        method: test
        intent: Check runtime subcommands and explicit project selection flags.
        observable: Runtime inspect and prepare plus run project-config/project-runtime exist.
        selector:
          runner: pytest
          node_id: tests/unit/docs/test_code_review_command_parity.py::test_generated_contract_documents_portable_runtime_registration
