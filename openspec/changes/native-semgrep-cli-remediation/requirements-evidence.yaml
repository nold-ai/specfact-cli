    verification_cases:
    - case_id: NATIVE-PREP-005
      scenario_id: fixed-native-pcre2-preserves-the-actual-macos-scanner-platform
      method: test
      intent: Execute the exact authored regression for fixed native pcre2 preserves the actual macos
        scanner platform.
      observable: Authenticated PCRE2 correction and notice are installed with the original engine; mismatches
        block publication. Actual minimum macOS15 is documented without claiming macOS11 compatibility.
      selector:
        runner: pytest
        node_id: tests/unit/scripts/test_native_semgrep_provisioning.py::test_macos_fixed_pcre2_is_authenticated_before_publication[none]
  openspec:native-semgrep-cli-remediation:native-semgrep-cli:isolate-native-source-building-and-preserve-argument-boundaries:
