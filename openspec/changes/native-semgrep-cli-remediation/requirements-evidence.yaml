      method: test
      intent: Execute the exact authored regression for keep native component identities visible in existing
        delivery evidence.
      observable: Metadata cannot refer to removed or absent files. Existing SPDX records preserve file
        hashes and known corrected versions; unknown versions and C-library notice coverage remain unasserted.
      selector:
        runner: pytest
        node_id: tests/unit/scripts/test_native_semgrep_provisioning.py::test_component_references_reject_absent_installed_file
  openspec:native-semgrep-cli-remediation:native-semgrep-cli:keep-native-hatch-trust-local-to-the-scanner:
