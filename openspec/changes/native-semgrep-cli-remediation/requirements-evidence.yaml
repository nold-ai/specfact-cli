schema_version: '2'
requirements:
  openspec:native-semgrep-cli-remediation:native-semgrep-cli:build-the-windows-curl-correction-from-frozen-inputs:
    rationale: build the windows curl correction from frozen inputs
    stakeholder_refs:
    - nold-ai/specfact-cli#786
    touchpoints:
    - id: existing-owner
      kind: config_file
      locator: .github/actions/setup-frozen-python/windows_curl.py
    verification_cases:
    - case_id: NATIVE-PREP-001
      scenario_id: build-the-windows-curl-correction-from-frozen-inputs
      method: test
      intent: Execute the exact authored regression for build the windows curl correction from frozen
        inputs.
      observable: The final policy retains the unmodified engine, frozen corrected curl and only the exact
        now-unneeded SSH removal. Cross-build identity is recorded separately; actual Windows execution
        remains required.
      selector:
        runner: pytest
        node_id: tests/unit/scripts/test_native_semgrep_provisioning.py::test_windows_selection_removes_ssh_and_binds_preverified_curl
  openspec:native-semgrep-cli-remediation:native-semgrep-cli:capture-native-json-at-the-existing-ci-boundary:
    rationale: capture native json at the existing ci boundary
    stakeholder_refs:
    - nold-ai/specfact-cli#786
    touchpoints:
    - id: existing-owner
      kind: config_file
      locator: .github/workflows/pr-orchestrator.yml
    verification_cases:
    - case_id: NATIVE-PREP-002
      scenario_id: capture-native-json-at-the-existing-ci-boundary
      method: test
      intent: Execute the exact authored regression for capture native json at the existing ci boundary.
      observable: The existing producer captures actual native stdout as JSON and preserves its CA input
        behavior without claiming a protected CI run.
      selector:
        runner: pytest
        node_id: tests/integration/analyzers/test_native_semgrep_cli.py::test_ci_producer_writes_native_json[absent-0]
  openspec:native-semgrep-cli-remediation:native-semgrep-cli:check-the-actual-companion-python-dependency-license-boundary:
    rationale: check the actual companion python dependency license boundary
    stakeholder_refs:
    - nold-ai/specfact-cli#786
    touchpoints:
    - id: existing-owner
      kind: config_file
      locator: scripts/check_license_compliance.py
    verification_cases:
    - case_id: NATIVE-PREP-003
      scenario_id: check-the-actual-companion-python-dependency-license-boundary
      method: test
      intent: Execute the exact authored regression for check the actual companion python dependency license
        boundary.
      observable: An empty selected companion manifest root fails before a success result; no empty-root
        or schema-only result is license approval. Positive exact-certifi and unsupported-dependency cases
        remain required in the full affected/current-head suite.
      selector:
        runner: pytest
        node_id: tests/unit/workflows/test_trustworthy_green_checks.py::test_companion_license_producer_checks_actual_manifests[None-1]
  ? openspec:native-semgrep-cli-remediation:native-semgrep-cli:development-scan-commands-do-not-restore-the-removed-python-graph
  : rationale: development scan commands do not restore the removed python graph
    stakeholder_refs:
    - nold-ai/specfact-cli#786
    touchpoints:
    - id: existing-owner
      kind: config_file
      locator: pyproject.toml
    verification_cases:
    - case_id: NATIVE-PREP-004
      scenario_id: development-scan-commands-do-not-restore-the-removed-python-graph
      method: inspection
      intent: Inspect the paired source and retained evidence for development scan commands do not restore
        the removed python graph.
      observable: Both prepared default environments remove Python Semgrep/MCP and retain direct certifi
        and native prerequisites. No declaration inspection substitutes for actual scanner availability.
  openspec:native-semgrep-cli-remediation:native-semgrep-cli:fixed-native-pcre2-preserves-the-actual-macos-scanner-platform:
    rationale: fixed native pcre2 preserves the actual macos scanner platform
