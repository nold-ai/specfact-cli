      scenario_id: isolate-native-source-building-and-preserve-argument-boundaries
      method: test
      intent: Execute the exact authored regression for isolate native source building and preserve argument
        boundaries.
      observable: Identical repeated CRT inputs are accepted and conflicting inputs rejected. Exact source/tool
        archives, response-file boundaries and cross-build-with-spaces evidence remain separately reviewed;
        actual Windows build is still required.
      selector:
        runner: pytest
        node_id: tests/unit/scripts/test_native_windows_curl_build.py::test_crt_selection_accepts_identical_compiler_copies
