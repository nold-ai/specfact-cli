      - id: turn-workflow-adoption-spec
        kind: config_file
        locator: openspec/changes/workflow-01-turn-orchestration/specs/turn-workflow-adoption/spec.md
    verification_cases:
      - case_id: module-owned-workflow-adoption-workflow-module-is-unavailable-inspection
        scenario_id: module-owned-workflow-adoption
        method: inspection
        intent: 'Inspect planned scenario: Workflow module is unavailable.'
        observable: an actionable installation/compatibility diagnostic is returned without a synthetic passing
          result. Planning inspection only; runtime implementation, execution and signed acceptance remain pending.
