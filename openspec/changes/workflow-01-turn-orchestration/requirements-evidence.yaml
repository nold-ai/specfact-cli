requirements:
  openspec:workflow-01-turn-orchestration:turn-workflow-adoption:module-owned-workflow-adoption:
    rationale: Inspect approved planning acceptance without claiming runtime or signed release evidence.
    stakeholder_refs:
      - nold-ai/specfact-cli#742
