name: policy-engine
version: "0.1.0"
commands:
  - policy
command_help:
  policy: "Policy validation and suggestion workflows (DoR/DoD/Flow/PI)"
pip_dependencies: []
module_dependencies: []
core_compatibility: ">=0.28.0,<1.0.0"
tier: community
schema_extensions:
